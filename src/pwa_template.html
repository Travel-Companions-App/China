<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Китайский">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b3261e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Китайский</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1b1a;--muted:#6b6660;--line:#e3ddd5;--card:#fff;--acc:#b3261e;--cy:#1f5f8b;--ok:#1f6f4a;--soft:#f1ebe3}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--fg:#efeae3;--muted:#a39d95;--line:#33302c;--card:#1f1e1c;--acc:#ff6b5e;--cy:#7cc0f0;--ok:#5bc48f;--soft:#2a2724}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.4 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
header select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
main{padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:600;line-height:1}
nav button.on{color:var(--acc)}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.zh{font-weight:700}
.py{color:var(--acc)}
.cy{color:var(--cy)}
.btn{border:0;border-radius:12px;padding:14px 10px;font:inherit;font-size:16px;background:var(--soft);color:var(--fg);flex:1}
.btn.no{background:var(--acc);color:#fff}
.btn.yes{background:var(--ok);color:#fff}
.row{display:flex;gap:10px;margin-top:12px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.fc{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
.fc .zh{font-size:clamp(40px,13vw,72px);line-height:1.2}
.fc .py{font-size:22px;margin-top:12px}
.fc .cy{font-size:20px;margin-top:2px}
.fc .ru{font-size:19px;margin-top:8px}
.fc .hint{margin-top:16px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:14px;font:inherit;text-align:left}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item .zh{font-size:24px;min-width:3.2em}
.item .t{flex:1;font-size:15px}
.say{border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
h2{font-size:13px;color:var(--acc);margin:20px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.sc .t{font-size:13px;color:var(--acc);font-weight:600}
.sc .zh{font-size:21px;margin-top:4px}
#full{position:fixed;inset:0;background:#fff;color:#000;z-index:20;padding:calc(24px + env(safe-area-inset-top)) 22px 40px;overflow:auto}
#full .zh{font-size:clamp(34px,10vw,64px);line-height:1.3}
#full .s{color:#555;font-size:16px;margin-top:16px}
#full .cy2{color:#1f5f8b;font-size:17px;margin-top:4px}
#full .close{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top));border:0;background:#eee;border-radius:20px;padding:8px 14px;font:inherit;font-size:15px}
.sylgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.syl{padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.syl b{font-weight:600}
.tips div{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.voice{font-size:13px;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;font:inherit;color:var(--fg);text-align:left}
.li .n{font-size:22px;font-weight:700;color:var(--acc);min-width:1.4em;text-align:center}
.li .tt{flex:1}.li .tt div:first-child{font-weight:600}
.li .st{font-size:13px;color:var(--ok);white-space:nowrap}
.back{border:0;background:none;color:var(--acc);font:inherit;font-size:16px;padding:4px 0;margin-bottom:6px}
.th h3{font-size:16px;margin:18px 0 6px;color:var(--acc)}
.th p{margin:6px 0;font-size:16px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ex .zh{font-size:22px;min-width:2.5em}
.ex .t{flex:1;font-size:15px}
.ex .note{font-size:13px;color:var(--muted)}
.big{width:100%;margin-top:16px}
.qz{font-size:clamp(30px,10vw,48px);font-weight:700;text-align:center;line-height:1.3}
.qq{font-size:17px;margin:4px 0 8px}
.why{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.opt small{display:block;color:var(--acc);font-size:13px}
.opt .ozh{font-size:20px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:56px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 10px;font:inherit;text-align:center}
.tile b{display:block;font-size:22px}.tile small{color:var(--acc);font-size:12px}
.ans{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:68px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bub{max-width:88%;border-radius:16px;padding:10px 12px;background:var(--card);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.bub .zh{font-size:22px}
.bub .note{font-size:13px;color:var(--muted);margin-top:2px}
.bub .tap{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font:inherit;font-size:14px;color:var(--fg)}
.seg button.on{background:var(--card);font-weight:600}
.pts li{margin:8px 0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;text-align:left}
.chip b{font-size:18px;display:block}.chip small{display:block;color:var(--muted);font-size:12px}
.src{font-size:13px;color:var(--muted);margin-top:16px}
.src a{color:var(--cy)}
.more .li .n{font-size:24px}
</style>
</head>
<body>
<header><select id="deck"></select><div class="voice muted" id="vstat"></div></header>
<main>
  <section id="v-show">
    <p class="muted">Нажмите карточку — откроется крупно, чтобы показать собеседнику.</p>
    <div id="shows"></div>
  </section>
  <section id="v-learn" class="hide">
    <div class="muted" id="lstat"></div>
    <div class="bar"><i id="lbar"></i></div>
    <label class="muted"><input type="checkbox" id="rev"> Наоборот: русский → китайский</label>
    <div class="fc" id="fc" style="margin-top:10px"></div>
    <div class="row"><button class="btn no" id="bNo">Не знаю</button><button class="btn" id="bSay">🔊</button><button class="btn yes" id="bYes">Знаю</button></div>
    <div class="row"><button class="btn" id="bReset" style="font-size:14px">Сбросить прогресс колоды</button></div>
  </section>
  <section id="v-quiz" class="hide">
    <div class="muted" id="qstat"></div>
    <div class="fc" id="qcard" style="min-height:26vh;margin-top:8px"></div>
    <div class="opts" id="qopts"></div>
    <div class="row"><button class="btn" id="qNext">Дальше</button></div>
  </section>
  <section id="v-list" class="hide">
    <input type="search" id="q" placeholder="Поиск: иероглиф, pinyin, кириллица, русский">
    <div id="list"></div>
  </section>
  <section id="v-les" class="hide"></section>
  <section id="v-dlg" class="hide"></section>
  <section id="v-gd" class="hide"></section>
  <section id="v-more" class="hide more">
    <button class="li" data-go="learn"><span class="n">🃏</span><span class="tt"><div>Карточки</div><div class="muted">Фразы, вывески и слова уроков</div></span></button>
    <button class="li" data-go="quiz"><span class="n">✅</span><span class="tt"><div>Тест</div><div class="muted">Выбрать перевод</div></span></button>
    <button class="li" data-go="syl"><span class="n">ā</span><span class="tt"><div>Слоги</div><div class="muted">Как читать pinyin, все 406 слогов</div></span></button>
  </section>
  <section id="v-syl" class="hide">
    <h2 style="margin-top:4px">Как читать</h2>
    <div class="tips" id="tips"></div>
    <h2>Все слоги</h2>
    <input type="search" id="sq" placeholder="Поиск слога: zh, xi, ань…">
    <div id="syls"></div>
  </section>
</main>
<nav id="tabs">
  <button data-v="show" class="on"><b>📋</b>Показать</button>
  <button data-v="les"><b>📖</b>Уроки</button>
  <button data-v="dlg"><b>💬</b>Диалоги</button>
  <button data-v="gd"><b>🧭</b>Справка</button>
  <button data-v="list"><b>🔎</b>Фразы</button>
  <button data-v="more"><b>⋯</b>Ещё</button>
</nav>
<div id="full" class="hide"></div>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ALL = [];
for (const [sect, items] of Object.entries(DATA.phrases)) for (const [zh, py, cy, ru] of items) ALL.push({zh, py, cy, ru, deck: "Фразы: " + sect});
for (const [zh, py, cy, ru, g] of DATA.signs) ALL.push({zh, py, cy, ru, deck: "Вывески: " + g});
for (const [zh, py, cy, ru] of DATA.numbers) ALL.push({zh, py, cy, ru, deck: "Цифры"});
for (const [zh, py, cy, ru] of DATA.stations) ALL.push({zh, py, cy, ru, deck: "Вокзалы"});
for (const l of DATA.lessons) for (const b of l.theory) if (b.k === "e") ALL.push({zh: b.zh, py: b.py, cy: b.cy, ru: b.ru, deck: `Урок ${l.n}: ${l.title}`});
ALL.forEach((c, i) => c.id = c.deck + "|" + c.zh);

const store = {
  get(k, d) { try { const v = localStorage.getItem("cn:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cn:" + k, JSON.stringify(v)); } catch {} }
};
let known = store.get("known", {});
const decks = ["Все", "Все фразы", "Все вывески", ...new Set(ALL.map(c => c.deck))];
decks.forEach(d => $("deck").add(new Option(d, d)));
$("deck").value = store.get("deck", "Все");
function cards() {
  const d = $("deck").value;
  if (d === "Все") return ALL;
  if (d === "Все фразы") return ALL.filter(c => c.deck.startsWith("Фразы"));
  if (d === "Все вывески") return ALL.filter(c => c.deck.startsWith("Вывески"));
  return ALL.filter(c => c.deck === d);
}

// ---- speech: системный китайский голос iOS
let zhVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
    $("vstat").textContent = zhVoice ? "🔊 Голос: " + zhVoice.name : (vs.length ? "🔇 Китайский голос не найден — скачайте его в настройках iOS" : "");
  } catch { $("vstat").textContent = "🔇 Озвучка недоступна в этом браузере"; }
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; setTimeout(pickVoice, 800); } catch {}
function say(text) {
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/……/g, "").replace(/\s*\/\s*/g, "，").replace(/[（(].*?[)）]/g, ""));
    u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}

// ---- tabs
let view = "show";
const UNDER_MORE = ["learn", "quiz", "syl"];
function go(v) {
  view = v;
  const tab = UNDER_MORE.includes(v) ? "more" : v;
  for (const x of document.querySelectorAll("#tabs button")) x.classList.toggle("on", x.dataset.v === tab);
  for (const s of document.querySelectorAll("main > section")) s.classList.toggle("hide", s.id !== "v-" + view);
  $("deck").parentElement.classList.toggle("hide", !(view === "learn" || view === "quiz" || view === "list"));
  try { speechSynthesis.cancel(); } catch {}
  render(); window.scrollTo(0, 0);
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
$("v-more").onclick = e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); };

// ---- show cards
function drawShows() {
  const box = $("shows"); box.innerHTML = "";
  DATA.show.forEach(c => {
    const d = document.createElement("div"); d.className = "sc";
    d.innerHTML = `<div class="t">${esc(c.title)}</div><div class="zh">${esc(c.zh.join(""))}</div><div class="muted">${esc(c.ru)}</div>`;
    d.onclick = () => openFull(c); box.appendChild(d);
  });
}
function openFull(c) {
  $("full").innerHTML = `<button class="close" id="fclose">Закрыть</button><div class="zh">${c.zh.map(esc).join("<br>")}</div>
    <div class="s">${esc(c.py)}</div><div class="cy2">${esc(c.cy)}</div><div class="s">${esc(c.ru)}</div>
    <button class="btn" id="fsay" style="margin-top:18px;width:100%;background:#eee;color:#000">🔊 Произнести</button>`;
  $("full").classList.remove("hide");
  $("fclose").onclick = () => $("full").classList.add("hide");
  $("fsay").onclick = () => say(c.zh.join(""));
}

// ---- flashcards
let cur = null, flipped = false;
function nextCard() {
  const cs = cards(); const pending = cs.filter(c => !known[c.id]);
  const pool = pending.length ? pending : cs;
  cur = pool[Math.floor(Math.random() * pool.length)]; flipped = false; drawCard();
}
function drawCard() {
  const cs = cards(); const k = cs.filter(c => known[c.id]).length;
  $("lstat").textContent = `Выучено ${k} из ${cs.length}` + (k === cs.length ? " — колода пройдена" : "");
  $("lbar").style.width = (cs.length ? 100 * k / cs.length : 0) + "%";
  if (!cur) return;
  const rev = $("rev").checked;
  const front = rev ? `<div class="ru" style="font-size:24px">${esc(cur.ru)}</div>` : `<div class="zh">${esc(cur.zh)}</div>`;
  const back = rev ? `<div class="zh">${esc(cur.zh)}</div><div class="py">${esc(cur.py)}</div><div class="cy">${esc(cur.cy)}</div>`
                   : `<div class="py">${esc(cur.py)}</div><div class="cy">${esc(cur.cy)}</div><div class="ru">${esc(cur.ru)}</div>`;
  $("fc").innerHTML = front + (flipped ? back : `<div class="hint muted">нажмите — перевернуть</div>`) + `<div class="hint muted">${esc(cur.deck)}</div>`;
}
$("fc").onclick = () => { flipped = !flipped; drawCard(); if (flipped) say(cur.zh); };
function mark(ok) { if (ok) known[cur.id] = 1; else delete known[cur.id]; store.set("known", known); nextCard(); }
$("bYes").onclick = () => mark(true);
$("bNo").onclick = () => mark(false);
$("bSay").onclick = () => cur && say(cur.zh);
$("bReset").onclick = () => { cards().forEach(c => delete known[c.id]); store.set("known", known); nextCard(); };
$("rev").onchange = drawCard;

// ---- quiz
let q = null, score = {ok: 0, n: 0};
function newQ() {
  const cs = cards();
  const right = cs[Math.floor(Math.random() * cs.length)];
  const wrong = [];
  const okW = c => c !== right && c.ru !== right.ru && !wrong.some(w => w.ru === c.ru);
  for (const pool of [cs, ALL]) for (const c of pool.slice().sort(() => Math.random() - .5)) { if (wrong.length >= 3) break; if (okW(c)) wrong.push(c); }
  const opts = [right, ...wrong].sort(() => Math.random() - .5);
  q = {right, opts, done: false};
  $("qcard").innerHTML = `<div class="zh">${esc(right.zh)}</div><div class="hint muted">Что это значит?</div>`;
  const box = $("qopts"); box.innerHTML = "";
  opts.forEach(o => { const b = document.createElement("button"); b.className = "opt"; b.textContent = o.ru; b.onclick = () => answer(o, b); box.appendChild(b); });
  $("qstat").textContent = `Верно ${score.ok} из ${score.n}`;
}
function answer(o, b) {
  if (q.done) return; q.done = true; score.n++;
  const btns = [...document.querySelectorAll(".opt")];
  btns[q.opts.indexOf(q.right)].classList.add("ok");
  if (o === q.right) score.ok++; else b.classList.add("bad");
  $("qcard").innerHTML += `<div class="py">${esc(q.right.py)}</div><div class="cy">${esc(q.right.cy)}</div>`;
  say(q.right.zh);
  $("qstat").textContent = `Верно ${score.ok} из ${score.n}`;
}
$("qNext").onclick = newQ;

// ---- list
const norm = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function drawList() {
  const s = norm($("q").value.trim());
  const cs = cards().filter(c => !s || c.zh.includes($("q").value.trim()) || norm(c.py).includes(s) || norm(c.cy).includes(s) || norm(c.ru).includes(s));
  let html = "", last = "";
  for (const c of cs) {
    if (c.deck !== last) { html += `<h2>${esc(c.deck)}</h2>`; last = c.deck; }
    html += `<div class="item"><div class="zh">${esc(c.zh)}</div><div class="t"><div class="py">${esc(c.py)}</div><div class="cy">${esc(c.cy)}</div><div>${esc(c.ru)}</div></div><button class="say" data-z="${esc(c.zh)}">🔊</button></div>`;
  }
  $("list").innerHTML = html || "<p class='muted'>Ничего не найдено</p>";
}
$("q").oninput = drawList;
$("list").onclick = e => { const b = e.target.closest(".say"); if (b) say(b.dataset.z); };

// ---- syllables
$("tips").innerHTML = DATA.tips.map(([a, b]) => `<div><b class="cy">${esc(a)}</b> — ${esc(b)}</div>`).join("");
function drawSyl() {
  const s = norm($("sq").value.trim());
  let html = "";
  for (const [title, list] of DATA.syllables) {
    const items = list.filter(([p, c]) => !s || p.startsWith(s) || norm(c).startsWith(s));
    if (!items.length) continue;
    html += `<h2>${esc(title)}</h2><div class="sylgrid">` + items.map(([p, c]) => `<div class="syl"><b>${esc(p)}</b> <span class="cy">${esc(c)}</span></div>`).join("") + "</div>";
  }
  $("syls").innerHTML = html || "<p class='muted'>Не найдено</p>";
}
$("sq").oninput = drawSyl;

// ---- общие помощники
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sayBtn = zh => `<button class="say" data-z="${esc(zh)}">🔊</button>`;
document.addEventListener("click", e => {
  const b = e.target.closest(".say"); if (b && !b.closest("#list")) { e.stopPropagation(); say(b.dataset.z); }
}, true);
const SOUND_HINT = `<p class="muted">🔊 Нужен звук: выключите беззвучный режим iPhone или подключите наушники.</p>`;

// ---- числа на слух
const DIG = "零一二三四五六七八九";
function num2zh(n) {
  if (n < 10) return DIG[n];
  if (n < 20) return "十" + (n % 10 ? DIG[n % 10] : "");
  if (n < 100) return DIG[Math.floor(n / 10)] + "十" + (n % 10 ? DIG[n % 10] : "");
  const big = (k, name) => { const h = Math.floor(n / k), r = n % k; let s = (h === 2 ? "两" : DIG[h]) + name;
    if (!r) return s; return s + (r < k / 10 ? "零" : "") + (r < 20 && r >= 10 ? "一" : "") + num2zh(r); };
  if (n < 1000) return big(100, "百");
  if (n < 10000) return big(1000, "千");
  return String(n);
}
const NPY = {"零": "líng", "一": "yī", "二": "èr", "两": "liǎng", "三": "sān", "四": "sì", "五": "wǔ", "六": "liù", "七": "qī", "八": "bā", "九": "jiǔ", "十": "shí", "百": "bǎi", "千": "qiān", "块": "kuài"};
const NCY = {"零": "линг", "一": "и", "二": "эр", "两": "лянг", "三": "сан", "四": "сы", "五": "у", "六": "лёу", "七": "чи", "八": "ба", "九": "дзёу", "十": "шы", "百": "бай", "千": "чьен", "块": "куай"};
function zhPy(s) { return [...s].map((c, i) => c === "一" && i < s.length - 1 && "百千".includes(s[i + 1]) ? "yì" : NPY[c]).join(" "); }
function zhCy(s) { return [...s].map(c => NCY[c]).join("-"); }
function numTask() {
  const r = Math.random(); let n, half = false;
  if (r < .25) n = 1 + Math.floor(Math.random() * 20);
  else if (r < .6) n = 20 + Math.floor(Math.random() * 80);
  else if (r < .9) n = 100 + Math.floor(Math.random() * 900);
  else n = 1000 + Math.floor(Math.random() * 9000);
  if (n < 100 && Math.random() < .25) half = true;
  const zh = num2zh(n) + "块" + (half ? "五" : "");
  const fmt = (v, h) => "¥ " + v + (h ? ",5" : "");
  const pool = new Set([fmt(n, half)]);
  const cands = [n + 10, n - 10, n * 10, Math.floor(n / 10) || n + 1, n + 1, Number(String(n).split("").reverse().join("")) || n + 2, n + 100];
  for (const c of shuffle(cands)) { if (pool.size >= 4) break; if (c > 0 && c !== n) pool.add(fmt(c, half)); }
  while (pool.size < 4) pool.add(fmt(n + pool.size * 3, half));
  const opts = shuffle([...pool]);
  return {t: "numq", zh, py: zhPy(zh), cy: zhCy(zh), ru: fmt(n, half), opts, ok: opts.indexOf(fmt(n, half))};
}

// ---- уроки
let lesState = null;  // {l, mode:'theory'|'ex'|'done', list, i, score, wrong, answered}
const lesBest = () => store.get("les", {});
function drawLessons() {
  const box = $("v-les");
  if (!lesState) {
    const best = lesBest();
    box.innerHTML = `<p class="muted">8 уроков по 30–45 минут: теория с озвучкой, потом упражнения. Слова уроков попадают в «Ещё → Карточки».</p>` +
      DATA.lessons.map(l => `<button class="li" data-l="${l.n}"><span class="n">${l.n}</span><span class="tt"><div>${esc(l.title)}</div><div class="muted">~${l.min} мин · ${l.ex.length} упражнений</div></span><span class="st">${best[l.n] != null ? "✓ " + best[l.n] + "%" : ""}</span></button>`).join("");
    box.onclick = e => { const b = e.target.closest("[data-l]"); if (b) { lesState = {l: DATA.lessons[b.dataset.l - 1], mode: "theory"}; drawLessons(); window.scrollTo(0, 0); } };
    return;
  }
  const S = lesState, l = S.l;
  if (S.mode === "theory") {
    let h = `<button class="back" data-a="list">‹ Уроки</button><h2 style="margin-top:0">Урок ${l.n}</h2><div style="font-size:22px;font-weight:700">${esc(l.title)}</div><p class="muted">${esc(l.goal)}</p><div class="th">`;
    for (const b of l.theory) {
      if (b.k === "h") h += `<h3>${esc(b.t)}</h3>`;
      else if (b.k === "p") h += `<p>${esc(b.t)}</p>`;
      else h += `<div class="ex"><div class="zh">${esc(b.zh)}</div><div class="t"><div class="py">${esc(b.py)}</div><div class="cy">${esc(b.cy)}</div><div>${esc(b.ru)}</div>${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}</div>${sayBtn(b.zh)}</div>`;
    }
    h += `</div><button class="btn yes big" data-a="start">Упражнения (${l.ex.length}) ›</button>`;
    box.innerHTML = h;
    box.onclick = e => { const a = e.target.closest("[data-a]"); if (!a) return;
      if (a.dataset.a === "list") { lesState = null; drawLessons(); }
      if (a.dataset.a === "start") startEx(l.ex); window.scrollTo(0, 0); };
    return;
  }
  if (S.mode === "done") {
    const pct = Math.round(100 * S.score / S.list.length);
    if (!S.retry) { const b = lesBest(); b[l.n] = Math.max(b[l.n] || 0, pct); store.set("les", b); }
    box.innerHTML = `<button class="back" data-a="list">‹ Уроки</button><div class="fc" style="min-height:30vh"><div style="font-size:48px">${pct >= 80 ? "🎉" : "💪"}</div><div style="font-size:22px;margin-top:8px">Верно ${S.score} из ${S.list.length}</div><div class="muted" style="margin-top:6px">${S.wrong.length ? "Ошибок: " + S.wrong.length : "Без ошибок"}</div></div>` +
      (S.wrong.length ? `<button class="btn no big" data-a="wrong">Повторить ошибки (${S.wrong.length})</button>` : "") +
      `<button class="btn big" data-a="again">Пройти заново</button><button class="btn big" data-a="theory">Теория урока</button>` +
      (l.n < DATA.lessons.length ? `<button class="btn yes big" data-a="next">Урок ${l.n + 1} ›</button>` : "");
    box.onclick = e => { const a = e.target.closest("[data-a]"); if (!a) return; const k = a.dataset.a;
      if (k === "list") lesState = null;
      if (k === "wrong") { startEx(S.wrong.map(x => x.t === "numq" ? {t: "num", n: 1} : x), true); return; }
      if (k === "again") { startEx(l.ex); return; }
      if (k === "theory") S.mode = "theory";
      if (k === "next") lesState = {l: DATA.lessons[l.n], mode: "theory"};
      drawLessons(); window.scrollTo(0, 0); };
    return;
  }
  drawEx();
}
function startEx(ex, retry) {
  const list = [];
  for (const e of ex) if (e.t === "num") for (let i = 0; i < e.n; i++) list.push(numTask()); else list.push(e);
  Object.assign(lesState, {mode: "ex", list, i: 0, score: 0, wrong: [], answered: false, retry: !!retry});
  drawLessons(); window.scrollTo(0, 0);
}
const audioTask = e => e.t === "tone" || e.t === "listen" || e.t === "numq";
function optHtml(o) { return Array.isArray(o) ? `<span class="ozh">${esc(o[0])}</span>${o[1] ? `<small class="opy hide">${esc(o[1])} · ${esc(o[2])}</small>` : ""}` : esc(o); }
function drawEx() {
  const S = lesState, e = S.list[S.i], box = $("v-les");
  S.answered = false;
  let h = `<button class="back" data-a="stop">‹ Урок ${S.l.n}</button><div class="muted">Упражнение ${S.i + 1} из ${S.list.length} · верно ${S.score}</div><div class="bar"><i style="width:${100 * S.i / S.list.length}%"></i></div>`;
  if (audioTask(e)) {
    const q = e.t === "tone" ? "Какой тон? Нажмите 🔊 и выберите" : e.t === "numq" ? "Сколько стоит? Послушайте" : "Что это значит? Послушайте";
    h += `<div class="qq">${q}</div>`;
    h += `<div style="text-align:center"><button class="btn" data-a="play" style="font-size:28px;padding:14px 30px;flex:none">🔊</button></div>`;
    if (e.t === "tone") h += `<div class="qz" style="margin-top:10px">${esc(e.zh)}</div>`;
    else h += `<div id="reveal" class="qz hide" style="margin-top:10px">${esc(e.zh)}</div><div style="text-align:center"><button class="back" data-a="show" id="showbtn">Показать текст</button></div>`;
    h += `<div id="qinfo"></div>`;
    h += SOUND_HINT;
  } else if (e.t === "choice") {
    h += `<div class="qq">${esc(e.q)}</div>` + (e.zh ? `<div class="qz">${esc(e.zh)} ${e.zh.includes("___") ? "" : sayBtn(e.zh)}</div>` : "");
  } else if (e.t === "order") {
    S.picked = []; S.order = shuffle(e.tiles.map((t, i) => i));
    if (S.order.every((v, i) => v === i) && e.tiles.length > 1) S.order.reverse();
    h += `<div class="qq">Соберите по-китайски: <b>${esc(e.ru)}</b></div><div class="ans tiles" id="ans"></div><div class="tiles" id="pool"></div>`;
  }
  if (e.t === "order") h += `<div class="row"><button class="btn" data-a="clear">Сбросить</button><button class="btn yes" data-a="check">Проверить</button></div>`;
  else h += `<div class="opts" id="opts">` + e.opts.map((o, i) => `<button class="opt" data-o="${i}">${optHtml(o)}</button>`).join("") + `</div>`;
  h += `<div id="fb"></div><div class="row hide" id="nextrow"><button class="btn yes" data-a="next">Дальше ›</button></div>`;
  box.innerHTML = h;
  if (e.t === "order") drawTiles();
  if (audioTask(e)) setTimeout(() => say(e.zh), 250);
  box.onclick = ev => {
    const o = ev.target.closest("[data-o]"); if (o) return answerEx(+o.dataset.o, o);
    const t = ev.target.closest("[data-tile]"); if (t) { if (S.answered) return; const k = +t.dataset.tile;
      if (t.dataset.from === "pool") S.picked.push(k); else S.picked = S.picked.filter(x => x !== k); drawTiles(); return; }
    const a = ev.target.closest("[data-a]"); if (!a) return; const k = a.dataset.a;
    if (k === "play") say(e.zh);
    if (k === "show") { $("reveal").classList.remove("hide"); a.classList.add("hide"); }
    if (k === "clear" && !S.answered) { S.picked = []; drawTiles(); }
    if (k === "check") checkOrder();
    if (k === "next") { S.i++; if (S.i >= S.list.length) S.mode = "done"; drawLessons(); window.scrollTo(0, 0); }
    if (k === "stop") { S.mode = "theory"; drawLessons(); window.scrollTo(0, 0); }
  };
}
function drawTiles() {
  const S = lesState, e = S.list[S.i];
  const tile = (k, from) => `<button class="tile" data-tile="${k}" data-from="${from}"><b>${esc(e.tiles[k][0])}</b><small>${esc(e.tiles[k][1])}</small></button>`;
  $("ans").innerHTML = S.picked.map(k => tile(k, "ans")).join("") || `<span class="muted" style="padding:14px 6px">нажимайте блоки по порядку</span>`;
  $("pool").innerHTML = S.order.filter(k => !S.picked.includes(k)).map(k => tile(k, "pool")).join("");
}
const clean = s => s.replace(/[，。？！、,.?!\s]/g, "");
function feedback(ok, text) {
  const S = lesState; S.answered = true;
  if (ok) S.score++; else S.wrong.push(S.list[S.i]);
  $("fb").innerHTML = `<div class="why" style="border-left:4px solid var(${ok ? "--ok" : "--acc"})"><b>${ok ? "Верно" : "Неверно"}</b>${text ? "<br>" + text : ""}</div>`;
  $("nextrow").classList.remove("hide");
}
function answerEx(i, btn) {
  const S = lesState, e = S.list[S.i]; if (S.answered) return;
  const btns = [...document.querySelectorAll("#opts .opt")];
  btns[e.ok].classList.add("ok"); if (i !== e.ok) btn.classList.add("bad");
  document.querySelectorAll(".opy").forEach(x => x.classList.remove("hide"));
  let info = "";
  if (audioTask(e)) {
    const r = $("reveal"); if (r) r.classList.remove("hide"); const sb = $("showbtn"); if (sb) sb.classList.add("hide");
    info = `<span class="py">${esc(e.py)}</span> · <span class="cy">${esc(e.cy)}</span>` + (e.ru && e.t !== "numq" ? ` — ${esc(e.ru)}` : "");
  }
  if (e.why) info += (info ? "<br>" : "") + esc(e.why);
  feedback(i === e.ok, info);
  const o = e.opts[e.ok]; if (e.t === "choice" && Array.isArray(o) && o[1]) say(o[0]);
}
function checkOrder() {
  const S = lesState, e = S.list[S.i]; if (S.answered) return;
  if (!S.picked.length) { $("fb").innerHTML = `<div class="why">Сначала соберите фразу из блоков.</div>`; return; }
  const got = clean(S.picked.map(k => e.tiles[k][0]).join(""));
  const right = clean(e.tiles.map(t => t[0]).join(""));
  const ok = got === right || e.alts.some(a => clean(a) === got);
  const full = e.tiles.map(t => t[0]).join("");
  feedback(ok, `<span style="font-size:22px;font-weight:700">${esc(full)}</span> ${sayBtn(full)}<br><span class="py">${esc(e.tiles.map(t => t[1]).join(" "))}</span><br><span class="cy">${esc(e.tiles.map(t => t[2]).join(" "))}</span>` + (e.why ? "<br>" + esc(e.why) : ""));
  say(full);
}

// ---- диалоги
let dlg = null; // {d, step, log:[html], errors, mode}
const dlgMode = () => store.get("dmode", "study");
function lineHtml(s, me) {
  const test = dlgMode() === "test" && !me;
  const det = `<div class="py">${esc(s.py)}</div><div class="cy">${esc(s.cy)}</div><div>${esc(s.ru)}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}`;
  return `<div class="bub${me ? " me" : ""}"><div style="display:flex;gap:8px;align-items:flex-start"><div class="zh" style="flex:1">${esc(s.zh)}</div>${sayBtn(s.zh)}</div>` +
    (test ? `<div class="det hide">${det}</div><div class="tap" data-a="rev">показать перевод</div>` : det) + `</div>`;
}
function drawDialogs() {
  const box = $("v-dlg");
  const segs = `<div class="seg"><button data-m="study" class="${dlgMode() === "study" ? "on" : ""}">Учебный: перевод виден</button><button data-m="test" class="${dlgMode() === "test" ? "on" : ""}">Проверка: на слух</button></div>`;
  if (!dlg) {
    const done = store.get("dlg", {});
    box.innerHTML = `<p class="muted">Сценарии с выбором реплики. Собеседник говорит по-разному — учитесь узнавать ключевые слова.</p>` + segs +
      DATA.dialogs.map((d, i) => `<button class="li" data-d="${i}"><span class="n">${i + 1}</span><span class="tt"><div>${esc(d.title)}</div><div class="muted">${esc(d.intro)}</div></span><span class="st">${done[i] != null ? "✓" + (done[i] ? " ош. " + done[i] : "") : ""}</span></button>`).join("");
  } else {
    const d = dlg.d;
    box.innerHTML = `<button class="back" data-a="list">‹ Диалоги</button><div style="font-size:20px;font-weight:700">${esc(d.title)}</div><p class="muted">${esc(d.intro)}</p>` + segs +
      `<div class="chat" id="chat">${dlg.log.join("")}</div><div id="turn"></div>`;
    drawTurn();
  }
  box.onclick = e => {
    const m = e.target.closest("[data-m]"); if (m) { store.set("dmode", m.dataset.m); if (dlg) { restartDlg(); } else drawDialogs(); return; }
    const di = e.target.closest("[data-d]"); if (di) { dlg = {d: DATA.dialogs[+di.dataset.d], idx: +di.dataset.d}; restartDlg(); window.scrollTo(0, 0); return; }
    const a = e.target.closest("[data-a]"); if (!a) return; const k = a.dataset.a;
    if (k === "list") { dlg = null; drawDialogs(); window.scrollTo(0, 0); }
    if (k === "rev") { a.previousElementSibling.classList.remove("hide"); a.remove(); }
    if (k === "again") { restartDlg(); window.scrollTo(0, 0); }
    if (k === "pick") pickDlg(+a.dataset.i, a);
  };
}
function restartDlg() { Object.assign(dlg, {step: 0, log: [], errors: 0}); advanceDlg(); drawDialogs(); }
function advanceDlg() {
  // выводим реплики собеседника до следующего хода пользователя
  const st = dlg.d.steps; let last = null;
  while (dlg.step < st.length && st[dlg.step].who === "them") { dlg.log.push(lineHtml(st[dlg.step])); last = st[dlg.step]; dlg.step++; }
  if (last) setTimeout(() => say(last.zh), 200);
}
function drawTurn() {
  const st = dlg.d.steps, t = $("turn");
  if (dlg.step >= st.length) {
    const done = store.get("dlg", {}); done[dlg.idx] = dlg.errors; store.set("dlg", done);
    t.innerHTML = `<div class="why" style="margin-top:14px"><b>Сценарий пройден</b>${dlg.errors ? ", ошибок: " + dlg.errors : " без ошибок"}.</div><div class="row"><button class="btn" data-a="again">Ещё раз</button><button class="btn yes" data-a="list">К списку</button></div>`;
    return;
  }
  const y = st[dlg.step], test = dlgMode() === "test";
  t.innerHTML = `<div class="qq" style="margin-top:14px"><b>Ваш ход:</b> ${esc(y.prompt)}</div><div class="opts">` +
    y.opts.map((o, i) => `<button class="opt" data-a="pick" data-i="${i}"><span class="ozh">${esc(o.zh)}</span><small>${esc(o.py)}</small>${test ? "" : `<div class="muted">${esc(o.ru)}</div>`}</button>`).join("") + `</div><div id="dfb"></div>`;
}
function pickDlg(i, btn) {
  const y = dlg.d.steps[dlg.step], o = y.opts[i];
  if (!o.ok) {
    dlg.errors++; btn.classList.add("bad");
    $("dfb").innerHTML = `<div class="why">${esc(o.ru)} — ${esc(o.why || "не подходит здесь")}</div>`;
    return;
  }
  dlg.log.push(lineHtml(o, true));
  if (o.why) dlg.log.push(`<div class="muted" style="font-size:13px">${esc(o.why)}</div>`);
  say(o.zh);
  dlg.step++;
  if (o.reply) { dlg.log.push(lineHtml(o.reply)); setTimeout(() => say(o.reply.zh), 1400); }
  const before = dlg.log.length; advanceDlg();
  drawDialogs();
  const c = $("chat"); if (c && c.lastElementChild) c.lastElementChild.scrollIntoView({behavior: "smooth", block: "center"});
}

// ---- справочник
let gdOpen = null;
function drawGuide() {
  const box = $("v-gd");
  if (gdOpen === null) {
    box.innerHTML = `<p class="muted">Практические заметки. Факты сверены с источниками ${esc(DATA.checked)}; помеченное [из памяти] — не сверено.</p>` +
      DATA.guide.map((g, i) => `<button class="li" data-g="${i}"><span class="n">${i + 1}</span><span class="tt"><div>${esc(g.title)}</div></span></button>`).join("");
  } else {
    const g = DATA.guide[gdOpen];
    box.innerHTML = `<button class="back" data-a="list">‹ Справка</button><div style="font-size:22px;font-weight:700">${esc(g.title)}</div><ul class="pts">` +
      g.points.map(p => `<li>${esc(p)}</li>`).join("") + `</ul>` +
      (g.phrases.length ? `<h2>Фразы — нажмите, чтобы показать крупно</h2><div class="chips">` + g.phrases.map((p, i) => `<button class="chip" data-p="${i}"><b>${esc(p[0])}</b><small>${esc(p[1])} · ${esc(p[2])}</small><small>${esc(p[3])}</small></button>`).join("") + `</div>` : "") +
      `<div class="src">Источники (проверено ${esc(DATA.checked)}):<br>` + g.sources.map(s => `• <a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a> — ${esc(s[2])}`).join("<br>") + `</div>` +
      (gdOpen + 1 < DATA.guide.length ? `<button class="btn big" data-a="next">${esc(DATA.guide[gdOpen + 1].title)} ›</button>` : "");
  }
  box.onclick = e => {
    const gi = e.target.closest("[data-g]"); if (gi) { gdOpen = +gi.dataset.g; drawGuide(); window.scrollTo(0, 0); return; }
    const p = e.target.closest("[data-p]"); if (p) { const [zh, py, cy, ru] = DATA.guide[gdOpen].phrases[+p.dataset.p]; openFull({zh: [zh], py, cy, ru}); return; }
    const a = e.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "list") gdOpen = null;
    if (a.dataset.a === "next") gdOpen++;
    drawGuide(); window.scrollTo(0, 0);
  };
}

$("deck").onchange = () => { store.set("deck", $("deck").value); cur = null; render(); };
function render() {
  if (view === "show") drawShows();
  if (view === "les") drawLessons();
  if (view === "dlg") drawDialogs();
  if (view === "gd") drawGuide();
  if (view === "learn") { if (!cur || !cards().includes(cur)) nextCard(); else drawCard(); }
  if (view === "quiz") newQ();
  if (view === "list") drawList();
  if (view === "syl") drawSyl();
}
$("deck").parentElement.classList.add("hide");
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
