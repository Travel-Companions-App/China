<style>
:root{--bg:#faf8f5;--fg:#1c1b1a;--muted:#6b6660;--line:#e3ddd5;--card:#fff;--acc:#b3261e;--cy:#1f5f8b;--ok:#1f6f4a;--soft:#f1ebe3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141312;--fg:#efeae3;--muted:#a39d95;--line:#33302c;--card:#1f1e1c;--acc:#ff6b5e;--cy:#7cc0f0;--ok:#5bc48f;--soft:#2a2724;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141312;--fg:#efeae3;--muted:#a39d95;--line:#33302c;--card:#1f1e1c;--acc:#ff6b5e;--cy:#7cc0f0;--ok:#5bc48f;--soft:#2a2724;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.4 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
header select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
main{padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:600;line-height:1}
nav button.on{color:var(--acc)}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.zh{font-weight:700}
.py{color:var(--acc)}
.cy{color:var(--cy)}
.btn{border:0;border-radius:12px;padding:14px 10px;font:inherit;font-size:16px;background:var(--soft);color:var(--fg);flex:1}
.btn.no{background:var(--acc);color:#fff}
.btn.yes{background:var(--ok);color:#fff}
.row{display:flex;gap:10px;margin-top:12px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.fc{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
.fc .zh{font-size:clamp(40px,13vw,72px);line-height:1.2}
.fc .py{font-size:22px;margin-top:12px}
.fc .cy{font-size:20px;margin-top:2px}
.fc .ru{font-size:19px;margin-top:8px}
.fc .hint{margin-top:16px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:14px;font:inherit;text-align:left}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item .zh{font-size:24px;min-width:3.2em}
.item .t{flex:1;font-size:15px}
.item.long{flex-wrap:wrap;row-gap:2px}.item.long .zh{flex-basis:100%}
.say{border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
h2{font-size:13px;color:var(--acc);margin:20px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.sc .t{font-size:13px;color:var(--acc);font-weight:600}
.sc .zh{font-size:21px;margin-top:4px}
#full{position:fixed;inset:0;background:#fff;color:#000;z-index:20;overflow:hidden;--fz:1}
#full .fbody{position:absolute;inset:0;overflow:auto;padding:calc(64px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom))}
#full.rot .fbody{inset:auto;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);padding:24px 28px 24px 28px}
#full .zh{font-size:calc(clamp(34px,10vw,64px) * var(--fz));line-height:1.3;overflow-wrap:anywhere}
#full.rot .zh{font-size:calc(clamp(34px,10vh,72px) * var(--fz))}
#full .s{color:#555;font-size:16px;margin-top:16px}
#full .cy2{color:#1f5f8b;font-size:17px;margin-top:4px}
#full .ftop,#full .fbot{position:absolute;left:0;right:0;display:flex;gap:8px;padding:0 12px;z-index:2}
#full .ftop{top:calc(10px + env(safe-area-inset-top));justify-content:space-between;align-items:center}
#full .fbot{bottom:calc(14px + env(safe-area-inset-bottom))}
#full .fb{border:0;background:#eee;color:#000;border-radius:20px;padding:9px 14px;font:inherit;font-size:15px;min-width:44px}
#full .fbot .fb{flex:1;padding:12px 6px}
#full .fb.on{background:#ffe08a}
#full .fpos{font-size:13px;color:#777}
.fav{border:0;background:none;font-size:20px;color:var(--muted);width:40px;height:40px;flex:none;padding:0}
.fav.on{color:#e0a000}
.home{padding-top:8px}
.hero{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero h1{margin:0;font-size:30px;letter-spacing:-.01em}
.hero h1 span{color:var(--acc)}
.net{font-size:12px;color:var(--muted);white-space:nowrap}
.net i{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--muted);margin-right:5px;vertical-align:1px}
.net.on i{background:var(--ok)}
.sub{color:var(--muted);font-size:15px;margin:4px 0 14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.qk{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:12px 8px;font:inherit;font-size:13px;text-align:center}
.qk b{display:block;font-size:22px;margin-bottom:4px;font-weight:700}
.qk.main{background:var(--acc);border-color:var(--acc);color:#fff}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%;font:inherit;color:var(--fg);text-align:left;display:block}
.blk .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.blk .big2{font-size:20px;font-weight:600;margin-top:2px}
.blk .zh{font-size:26px}
.res h2:first-child{margin-top:8px}
.ritem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ritem .t{flex:1;min-width:0}
.ritem .zh{font-size:22px}
.ritem .m{font-size:14px}
.rlink{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;padding:12px 0}
.rlink small{display:block;color:var(--muted);font-size:13px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#upd span{flex:1}
#upd button{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;background:var(--acc);color:#fff}
.form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.form input,.form textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cur{font-size:12px;color:#fff;background:var(--ok);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.srsrow{display:flex;gap:6px;font-size:13px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.srsrow b{color:var(--fg)}
.sylgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.syl{padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.syl b{font-weight:600}
.tips div{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.voice{font-size:13px;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;font:inherit;color:var(--fg);text-align:left}
.li .n{font-size:22px;font-weight:700;color:var(--acc);min-width:1.4em;text-align:center}
.li .tt{flex:1}.li .tt div:first-child{font-weight:600}
.li .st{font-size:13px;color:var(--ok);white-space:nowrap}
.back{border:0;background:none;color:var(--acc);font:inherit;font-size:16px;padding:4px 0;margin-bottom:6px}
.th h3{font-size:16px;margin:18px 0 6px;color:var(--acc)}
.th p{margin:6px 0;font-size:16px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ex .zh{font-size:22px;min-width:2.5em}
.ex .t{flex:1;font-size:15px}
.ex .note{font-size:13px;color:var(--muted)}
.big{width:100%;margin-top:16px}
.qz{font-size:clamp(30px,10vw,48px);font-weight:700;text-align:center;line-height:1.3}
.qq{font-size:17px;margin:4px 0 8px}
.why{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.opt small{display:block;color:var(--acc);font-size:13px}
.opt .ozh{font-size:20px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:56px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 10px;font:inherit;text-align:center}
.tile b{display:block;font-size:22px}.tile small{color:var(--acc);font-size:12px}
.ans{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:68px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font:inherit;font-size:14px;color:var(--fg)}
.seg button.on{background:var(--card);font-weight:600}
.pts li{margin:8px 0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;text-align:left}
.chip b{font-size:18px;display:block}.chip small{display:block;color:var(--muted);font-size:12px}
.src{font-size:13px;color:var(--muted);margin-top:16px}
.src a{color:var(--cy)}
.more .li .n{font-size:24px}
.hero h1{font-size:24px}
.hrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .t{flex:1;min-width:0}
.hrow .zh{font-size:22px;line-height:1.25}
.hrow .m{font-size:14px}
.hrow .zh,.hrow .m{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hhead{display:flex;justify-content:space-between;align-items:baseline}
.hhead button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:4px 0}
.sec{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 6px;font:inherit;font-size:14px;text-align:center;line-height:1.2}
.sec small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pl{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.pl .li{margin:0;flex:1;min-width:0}
.pl .ed{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;width:52px;font:inherit;font-size:18px;flex:none}
.qedit .li{margin-bottom:6px}
.mv{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;width:40px;height:40px;font:inherit;font-size:16px;flex:none}
.mv:disabled{opacity:.35}
.erow{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow .t{flex:1;min-width:0}
.erow select{flex:1;font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{font-weight:600;cursor:pointer}
.faq p,.faq li{font-size:15px;margin:6px 0}
.pl .zh2{font-size:19px;font-weight:700;overflow-wrap:anywhere}
/* двойной тап не увеличивает страницу; щипок остаётся */
*{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.dsecs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.dsecs .sec{font-size:16px;padding:14px 12px;text-align:left}
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.lhead .back{margin:0}
.ltitle{font-size:22px;font-weight:700;margin:0 0 10px}
.hintbox{background:color-mix(in srgb,var(--acc) 9%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px;padding:12px 14px;font-size:15px;margin:4px 0 10px}
.empty{color:var(--muted);font-size:14px;padding:4px 0 2px;margin:0}
.addfav{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px dashed var(--line);background:none;color:var(--acc);border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:600;margin-top:8px}
.addfav b{font-size:26px;line-height:1;font-weight:500}
.hhead .plus{font-size:24px;color:var(--acc);padding:0 4px;line-height:1}
/* свайп влево по строке → «Удалить», как в Почте */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw .swdel{position:absolute;top:0;bottom:0;right:0;width:88px;border:0;background:#d93025;color:#fff;font:inherit;font-size:15px}
.sw .swc{position:relative;background:var(--bg);transition:transform .2s ease}
.sw.drag .swc{transition:none}
.sw:not(.open):not(.drag) .swdel{visibility:hidden}
.sw.pls{margin-bottom:8px;border-radius:14px}.sw.pls .pl{margin:0}
/* вводный гайд и «Что нового» */
#intro{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom))}
#intro .itop{display:flex;justify-content:flex-end;min-height:36px}
#intro .itop button{border:0;background:none;color:var(--muted);font:inherit;font-size:16px;padding:6px 0}
#intro .ibody{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center}
#intro .ibig{font-size:56px;font-weight:700;color:var(--acc);line-height:1.1}
#intro h3{font-size:26px;margin:10px 0 12px;line-height:1.2}
#intro p,#intro li{font-size:17px;margin:8px 0;line-height:1.45}
#intro ul{padding-left:20px;margin:6px 0}
#intro .dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
#intro .dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
#intro .dots i.on{background:var(--acc);width:20px}
#intro .ver{font-size:13px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header><select id="deck"></select><div class="voice muted" id="vstat"></div></header>
<noscript><p style="padding:16px">Офлайн-разговорник китайского для туриста: фразы с иероглифами, pinyin и произношением кириллицей, карточки для таксиста, уроки и справочник. Для работы включите JavaScript. Исходники и описание: <a href="https://github.com/Travel-Companions-App/China">github.com/Travel-Companions-App/China</a>.</p></noscript>
<main>
  <section id="v-home" class="home"></section>
  <section id="v-show" class="hide">
    <p class="muted">Здесь ваше избранное. Нажмите ☆ на любой фразе — в поиске, Словаре или при показе крупно — и она появится здесь. Нажмите карточку — откроется крупно, листайте свайпом.</p>
    <div id="shows"></div>
  </section>
  <section id="v-learn" class="hide">
    <div class="srsrow" id="lstat"></div>
    <label class="muted"><input type="checkbox" id="rev"> Наоборот: русский → китайский</label><br><label class="muted"><input type="checkbox" id="pyf"> Pinyin сразу (вместе с иероглифами)</label>
    <div class="fc" id="fc" style="margin-top:10px"></div>
    <div class="row"><button class="btn" id="bBack">‹ Назад</button><button class="btn" id="bSay" style="flex:.6">🔊</button><button class="btn yes" id="bNext">Дальше ›</button></div>
    <div class="row"><button class="btn" id="bHide">Знаю — не показывать</button></div>
    <p class="muted" style="text-align:center;margin:8px 0 0">Нажмите карточку — перевод и произношение. Свайп влево — дальше, вправо — назад.</p>
    <div class="row"><button class="btn" id="bHidden" style="font-size:14px"></button></div>
    <div id="lhid"></div>
  </section>
  <section id="v-quiz" class="hide">
    <div class="muted" id="qstat"></div>
    <div class="fc" id="qcard" style="min-height:26vh;margin-top:8px"></div>
    <div class="opts" id="qopts"></div>
    <div class="row"><button class="btn" id="qNext">Дальше</button></div>
  </section>
  <section id="v-dict" class="hide"></section>
  <section id="v-list" class="hide">
    <div class="lhead"><button class="back" id="lback">‹ Словарь</button><span class="muted" id="lcount"></span></div>
    <div class="ltitle" id="ltitle"></div>
    <div id="lhint"></div>
    <input type="search" id="q" placeholder="Поиск в разделе: иероглиф, pinyin, кириллица, русский">
    <div id="list"></div>
  </section>
  <section id="v-les" class="hide"></section>
  <section id="v-gd" class="hide"></section>
  <section id="v-more" class="hide more">
    <button class="li" data-go="places"><span class="n">📍</span><span class="tt"><div>Мои места</div><div class="muted">Адреса иероглифами → карточка для такси. Хранятся на этом iPhone</div></span></button>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("cn:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cn:" + k, JSON.stringify(v)); } catch {} }
};
// первый запуск на этом устройстве: ещё нет ни одного ключа cn:* (до любой записи ниже)
let FRESH = false;
try { FRESH = !Object.keys(localStorage).some(k => k.startsWith("cn:")); } catch {}

const ALL = [];
for (const [sect, items] of Object.entries(DATA.phrases)) for (const [zh, py, cy, ru] of items) ALL.push({zh, py, cy, ru, deck: "Фразы: " + sect});
for (const [zh, py, cy, ru, g] of DATA.signs) ALL.push({zh, py, cy, ru, deck: "Вывески: " + g});
// колода «Цифры» заменена разделами «Числа», «Количество», «Цены на слух»;
// вокзалы входят в раздел «Поезд» (собирается в build_pwa.py)
for (const l of DATA.lessons) for (const b of l.theory) if (b.k === "e") ALL.push({zh: b.zh, py: b.py, cy: b.cy, ru: b.ru, deck: `Урок ${l.n}: ${l.title}`});
ALL.forEach((c, i) => c.id = c.deck + "|" + c.zh);

// ---- pinyin → кириллица: те же правила, что translit.py (таблица слогов приходит из сборки)
const SYL = new Map(); for (const [, list] of DATA.syllables) for (const [p, c] of list) SYL.set(p, c);
const stripTones = t => t.normalize("NFD").replace(/[\u0300-\u0307\u0309-\u036f]/g, "").normalize("NFC");  // тоны долой, ü (U+0308) оставляем
function segment(w) {
  const best = [[]];
  for (let i = 0; i < w.length; i++) {
    if (!best[i]) continue;
    for (let L = 1; L <= Math.min(6, w.length - i); L++) {
      const p = w.slice(i, i + L);
      if (SYL.has(p) && (!best[i + L] || best[i].length + 1 < best[i + L].length)) best[i + L] = best[i].concat(p);
    }
  }
  return best[w.length] || null;
}
function wordCyr(w) {
  const parts = [];
  for (const chunk of stripTones(w).toLowerCase().split("'")) {
    let seg = segment(chunk), er = "";
    if (!seg && chunk.endsWith("r")) { seg = segment(chunk.slice(0, -1)); er = "р"; }
    if (!seg) return null;
    const cy = seg.map(x => SYL.get(x)); cy[cy.length - 1] += er; parts.push(...cy);
  }
  return parts.join("-");
}
const toCyr = t => String(t).replace(/[A-Za-z\u00C0-\u024F']+/g, w => wordCyr(w) ?? w);

// ---- мои фразы (добавлены пользователем, например из ответа Claude)
const MY = "Мои фразы";
let myList = store.get("my", []);
function syncMy() {
  for (let i = ALL.length - 1; i >= 0; i--) if (ALL[i].deck === MY) ALL.splice(i, 1);
  for (const m of myList) ALL.push({zh: m.zh, py: m.py, cy: toCyr(m.py), ru: m.ru, deck: MY, id: MY + "|" + m.zh});
}
syncMy();

const DAY = 864e5;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isoDay = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const parseDay = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]).getTime() : null; };

// ---- карточки: скрытые («знаю — не показывать»); старое интервальное повторение удалено
try { localStorage.removeItem("cn:srs"); localStorage.removeItem("cn:known"); } catch {}
let hidden = store.get("hidden", {});
const isHidden = c => !!hidden[c.id];

// ---- избранное: снимок фразы, чтобы показывать без поиска по данным
let favs = store.get("favs", {});
const favId = c => c.id || ("x|" + [].concat(c.zh).join(""));
const isFav = c => !!favs[favId(c)];
function toggleFav(c) {
  const id = favId(c);
  if (favs[id]) delete favs[id]; else favs[id] = {id, zh: [].concat(c.zh), py: c.py, cy: c.cy, ru: c.ru, t: Date.now()};
  store.set("favs", favs); return !!favs[id];
}
const favCards = () => Object.values(favs).sort((a, b) => a.t - b.t).map(f => ({...f, zh: f.zh.join(""), lines: f.zh, deck: "★ Избранное"}));
// фраза переехала в другой раздел (ред. 12: «Слышите в ответ», «Вокзалы», пауэрбанк) — переносим её id в избранном и скрытых
(function remapIds() {
  const ids = new Set(ALL.map(c => c.id)), byZh = new Map();
  for (const c of ALL) if (/^(Фразы|Вывески)/.test(c.deck)) byZh.set(c.zh, byZh.has(c.zh) ? null : c.id);
  const fix = (obj, key) => { let ch = false;
    for (const id of Object.keys(obj)) {
      if (ids.has(id) || !/^(Фразы: |Вывески: |Вокзалы\|)/.test(id)) continue;
      const nid = byZh.get(id.slice(id.indexOf("|") + 1)); if (!nid || obj[nid]) continue;
      obj[nid] = typeof obj[id] === "object" ? {...obj[id], id: nid} : obj[id]; delete obj[id]; ch = true;
    }
    if (ch) store.set(key, obj); };
  fix(favs, "favs"); fix(hidden, "hidden");
})();

const decks = ["Все", "★ Избранное", MY, "Все фразы", "Все вывески", ...new Set(ALL.map(c => c.deck).filter(d => d !== MY))];
decks.forEach(d => $("deck").add(new Option(d, d)));
$("deck").value = store.get("deck", "Все");
const cards = () => deckCards($("deck").value);
function deckCards(d) {
  if (d === "Все") return ALL;
  if (d === "★ Избранное") return favCards();
  if (d === "Все фразы") return ALL.filter(c => c.deck.startsWith("Фразы"));
  if (d === "Все вывески") return ALL.filter(c => c.deck.startsWith("Вывески"));
  return ALL.filter(c => c.deck === d);
}

// ---- speech: системный китайский голос iOS
let zhVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    const want = store.get("voice", "");
    zhVoice = (want && zhVoices().find(v => v.voiceURI === want)) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
    $("vstat").textContent = zhVoice ? "🔊 Голос: " + zhVoice.name : (vs.length ? "🔇 Китайский голос не найден — скачайте его в настройках iOS" : "");
  } catch { $("vstat").textContent = "🔇 Озвучка недоступна в этом браузере"; }
}
try { pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); try { if (view === "set") drawSettings(); } catch {} }; setTimeout(pickVoice, 800); } catch {}
function zhVoices() { try { return speechSynthesis.getVoices().filter(v => /^(zh|cmn|yue)/i.test(v.lang)); } catch { return []; } }
function say(text) {
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/……/g, "").replace(/\s*\/\s*/g, "，").replace(/[（(].*?[)）]/g, ""));
    u.lang = zhVoice ? zhVoice.lang : "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = store.get("rate", 0.8);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}

// ---- навигация «назад» как в iOS: каждый переход вглубь пишется в историю браузера (pushState),
// поэтому системный свайп от левого края в установленном приложении возвращает на шаг назад (popstate).
// Кнопки «‹ …» и ✕ делают то же через navBack(). Смена вкладки сбрасывает стек.
const NAV = {stack: [], silent: 0};
try { history.replaceState({d: 0}, ""); } catch {}
function navPush(undo) { NAV.stack.push(undo); try { history.pushState({d: NAV.stack.length}, ""); } catch {} }
function navBack(n = 1) {
  n = Math.min(n, NAV.stack.length); if (!n) return false;
  const fs = NAV.stack.splice(NAV.stack.length - n).reverse();
  NAV.silent++; try { history.go(-n); } catch { NAV.silent--; }
  for (const f of fs) { try { f(); } catch {} }
  return true;
}
function navReset() { const n = NAV.stack.length; if (!n) return; NAV.stack = []; NAV.silent++; try { history.go(-n); } catch { NAV.silent--; } }
window.addEventListener("popstate", e => {
  if (NAV.silent) { NAV.silent--; return; }
  const d = (e.state && e.state.d) || 0;
  while (NAV.stack.length > d) { const f = NAV.stack.pop(); try { f(); } catch {} }
});

// ---- tabs
let view = "home";
const TABS = ["home", "dict", "show", "more"];
const PARENT = {list: "dict", learn: "more", quiz: "more", syl: "more", places: "more", set: "more", my: "more", les: "more", gd: "more", faq: "more"};
const tabOf = v => PARENT[v] || v;
function go(v, keep, nav) {
  if (v === view && v === "home" && !keep) { homeQ = ""; homeEdit = false; }
  const prev = view;
  if (v !== prev) { if (v === "les") lesState = null; if (v === "gd") gdOpen = null; if (v === "places") placeEdit = null; }
  if (tabOf(v) !== "dict") dictHint = false;
  if (nav !== "none") {
    if (TABS.includes(v)) navReset();                     // вкладка — корень, назад некуда
    else if (v !== prev) navPush(() => go(prev, true, "none"));  // переход вглубь
  }
  view = v;
  for (const x of document.querySelectorAll("#tabs button")) x.classList.toggle("on", x.dataset.v === tabOf(v));
  for (const s of document.querySelectorAll("main > section")) s.classList.toggle("hide", s.id !== "v-" + view);
  $("deck").parentElement.classList.toggle("hide", !(view === "learn" || view === "quiz"));
  try { speechSynthesis.cancel(); } catch {}
  render(); window.scrollTo(0, 0);
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
$("v-more").onclick = e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); };

// ---- show cards
function placeCard(p) {
  const T = DATA.place;
  return {id: "place:" + p.id, title: "Такси → " + (p.name || "место"),
    zh: [T.taxi[0], p.zh, p.addr, p.phone ? T.phone + p.phone : ""].filter(Boolean),
    py: T.taxi[1], cy: T.taxi[2], ru: "Водитель, отвезите нас, пожалуйста, сюда: " + (p.name || "это место") + (p.note ? " (" + p.note + ")" : "") + "."};
}
function presetCards() { return [...DATA.show.map(c => ({...c, id: "show:" + c.id})), ...places().map(placeCard)]; }
function drawShows() {
  const box = $("shows"); box.innerHTML = "";
  const all = favCards().map(f => ({...f, zh: f.lines, title: f.deck === "★ Избранное" ? "★" : f.deck}));
  if (!all.length) { box.innerHTML = `<p class="muted" style="margin-top:20px">Пока пусто. Найдите фразу через поиск на главной или в «Словаре» и нажмите ☆.</p>`; return; }
  all.forEach((c, i) => {
    const d = document.createElement("div"); d.className = "sc";
    d.innerHTML = `<div class="zh">${esc(c.zh.join(""))}</div><div class="muted"><span class="py">${esc(c.py || "")}</span> · ${esc(c.ru)}</div>`;
    d.onclick = () => openFull(c, all, i); box.appendChild(d);
  });
}

// ---- показ крупно: свайпы, размер, поворот, экран не гаснет
let fullS = null, wakeLock = null;
async function lockScreen() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch { wakeLock = null; }
}
function unlockScreen() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (fullS && document.visibilityState === "visible") lockScreen(); });
// ---- недавние: снимки последних открытых фраз
const recent = () => store.get("recent", []);
function addRecent(c) {
  const id = favId(c), r = recent().filter(x => x.id !== id);
  r.unshift({id, zh: [].concat(c.lines || c.zh), py: c.py || "", cy: c.cy || "", ru: c.ru || "", deck: c.deck || c.title || ""});
  store.set("recent", r.slice(0, 12));
}
function openFull(c, list, i) {
  list = list && list.length ? list : [c]; i = list && list.length ? (i || 0) : 0;
  try { addRecent(list[i]); } catch {}
  fullS = {list, i, fz: store.get("fz", 1), rot: false};
  $("full").classList.remove("hide"); drawFull(); lockScreen();
  navPush(closeFullNow);
}
function closeFull() { if (!fullS) return; if (!navBack()) closeFullNow(); }
function closeFullNow() { if (!fullS) return; $("full").classList.add("hide"); $("full").classList.remove("rot"); fullS = null; unlockScreen(); try { speechSynthesis.cancel(); } catch {} if (view === "home" || view === "list" || view === "show" || view === "places") render(); }
function drawFull() {
  const S = fullS, c = S.list[S.i], lines = [].concat(c.lines || c.zh), F = $("full");
  F.style.setProperty("--fz", S.fz); F.classList.toggle("rot", S.rot);
  F.innerHTML = `<div class="ftop"><button class="fb" data-f="close">✕</button><span class="fpos">${S.list.length > 1 ? (S.i + 1) + " / " + S.list.length : ""}</span><span style="display:flex;gap:8px"><button class="fb${isPinned(c) ? " on" : ""}" data-f="pin" aria-label="Кнопка на главной">📌</button><button class="fb${isFav(c) ? " on" : ""}" data-f="fav">${isFav(c) ? "★" : "☆"}</button></span></div>
    <div class="fbody"><div class="zh">${lines.map(esc).join("<br>")}</div>
    <div class="s">${esc(c.py || "")}</div><div class="cy2">${esc(c.cy || "")}</div><div class="s">${esc(c.ru || "")}</div></div>
    <div class="fbot"><button class="fb" data-f="minus">A−</button><button class="fb" data-f="plus">A+</button><button class="fb${S.rot ? " on" : ""}" data-f="rot">⟳ Поворот</button><button class="fb" data-f="say">🔊</button></div>`;
}
$("full").onclick = e => {
  const b = e.target.closest("[data-f]"); if (!b || !fullS) return; const k = b.dataset.f, c = fullS.list[fullS.i];
  if (k === "close") return closeFull();
  if (k === "fav") toggleFav({...c, zh: [].concat(c.lines || c.zh)});
  if (k === "pin") togglePin(c);
  if (k === "plus") fullS.fz = Math.min(2.2, +(fullS.fz + .15).toFixed(2));
  if (k === "minus") fullS.fz = Math.max(.6, +(fullS.fz - .15).toFixed(2));
  if (k === "plus" || k === "minus") store.set("fz", fullS.fz);
  if (k === "rot") fullS.rot = !fullS.rot;
  if (k === "say") say([].concat(c.lines || c.zh).join(""));
  drawFull();
};
function fullStep(d) { if (!fullS || fullS.list.length < 2) return; fullS.i = (fullS.i + d + fullS.list.length) % fullS.list.length; drawFull(); }
// свайпы: универсальный обработчик (горизонтальный жест, без конфликта с вертикальной прокруткой)
function onSwipe(el, fn) {
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, {passive: true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return; const t = e.changedTouches[0]; let dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (el === $("full") && fullS && fullS.rot) [dx, dy] = [dy, -dx];
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) fn(dx > 0 ? 1 : -1);
  }, {passive: true});
}
onSwipe($("full"), d => fullStep(-d));
document.addEventListener("keydown", e => {
  if (fullS) { if (e.key === "Escape") closeFull(); if (e.key === "ArrowRight") fullStep(1); if (e.key === "ArrowLeft") fullStep(-1); return; }
  if (view === "learn" && cur) { if (e.key === " ") { e.preventDefault(); $("fc").click(); } if (e.key === "ArrowRight") nextCard(); if (e.key === "ArrowLeft") prevCard(); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); go("home", true); setTimeout(() => $("hq") && $("hq").focus(), 0); }
});

// ---- flashcards: случайный порядок, история для «Назад», скрытые не показываются
let cur = null, flipped = false, hist = [], hpos = -1, bag = [], showHid = false;
function resetCards() { cur = null; hist = []; hpos = -1; bag = []; }
const visibleCards = () => cards().filter(c => !isHidden(c));
function nextCard() {
  const cs = visibleCards();
  if (hpos < hist.length - 1) { hpos++; cur = cs.find(c => c.id === hist[hpos]) || null; if (cur) { flipped = false; return drawCard(); } hist.splice(hpos); hpos = hist.length - 1; }
  if (!cs.length) { cur = null; return drawCard(); }
  const ids = new Set(cs.map(c => c.id));
  bag = bag.filter(id => ids.has(id));
  if (!bag.length) { bag = shuffle(cs.map(c => c.id)); if (bag.length > 1 && cur && bag[0] === cur.id) bag.push(bag.shift()); }
  const id = bag.shift(); cur = cs.find(c => c.id === id);
  hist.push(id); if (hist.length > 300) hist.shift(); hpos = hist.length - 1; flipped = false; drawCard();
}
function prevCard() {
  const cs = visibleCards();
  while (hpos > 0) { hpos--; const c = cs.find(x => x.id === hist[hpos]); if (c) { cur = c; flipped = false; return drawCard(); } }
}
function drawCard() {
  const all = cards(), nh = all.filter(isHidden).length, cs = all.length - nh;
  $("lstat").innerHTML = `<span>В колоде <b>${cs}</b></span>` + (nh ? `·<span>скрыто <b>${nh}</b> из ${all.length}</span>` : "");
  $("bBack").disabled = hpos <= 0;
  $("bHidden").textContent = showHid ? "Спрятать список скрытых" : `Скрытые (${nh})`; $("bHidden").parentElement.classList.toggle("hide", !nh && !showHid);
  drawHidden();
  if (!cur) { $("fc").innerHTML = `<div class="muted">${all.length ? (cs ? "" : "Все карточки колоды скрыты — верните нужные из списка «Скрытые»") : "Колода пуста — добавьте фразы в избранное звёздочкой ☆"}</div>`; return; }
  const rev = $("rev").checked, pyf = $("pyf").checked;
  const front = rev ? `<div class="ru" style="font-size:24px">${esc(cur.ru)}</div>` : `<div class="zh">${esc(cur.zh)}</div>` + (pyf ? `<div class="py">${esc(cur.py)}</div>` : "");
  const back = rev ? `<div class="zh">${esc(cur.zh)}</div><div class="py">${esc(cur.py)}</div><div class="cy">${esc(cur.cy)}</div>`

// ---- свайп влево по строке → кнопка «Удалить» (избранное, недавние, мои места)
const swWrap = (key, inner, cls) => `<div class="sw${cls ? " " + cls : ""}" data-sw="${esc(key)}"><button class="swdel" tabindex="-1">Удалить</button><div class="swc">${inner}</div></div>`;
let swOpen = null, swDragged = 0, swDraggedEl = null;
function swClose() { if (!swOpen) return; swOpen.querySelector(".swc").style.transform = ""; swOpen.classList.remove("open"); swOpen = null; }
document.addEventListener("touchstart", e => {
  const sw = e.target.closest(".sw");
  if (swOpen && swOpen !== sw) swClose();
  if (!sw || e.target.closest(".swdel") || e.touches.length !== 1) return;
  const t = e.touches[0]; if (t.clientX < 24) return;   // левый край — системный жест «назад»
  const c = sw.querySelector(".swc"), base = sw.classList.contains("open") ? -88 : 0, x0 = t.clientX, y0 = t.clientY;
  let dir = null, x = base;
  const move = ev => {

    if (!dir && (Math.abs(mx) > 8 || Math.abs(my) > 8)) dir = Math.abs(mx) > Math.abs(my) ? "h" : "v";
    if (dir !== "h") return;
    x = Math.max(-130, Math.min(0, base + mx));

  };
  const end = () => {
    document.removeEventListener("touchmove", move); document.removeEventListener("touchend", end); document.removeEventListener("touchcancel", end);
    sw.classList.remove("drag"); if (dir !== "h") return;
    swDragged = Date.now(); swDraggedEl = sw;
    if (x < -44) { c.style.transform = "translateX(-88px)"; sw.classList.add("open"); swOpen = sw; }
    else { c.style.transform = ""; sw.classList.remove("open"); if (swOpen === sw) swOpen = null; }
  };
  document.addEventListener("touchmove", move, {passive: false}); document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
}, {passive: true});
document.addEventListener("click", e => {
  const del = e.target.closest(".swdel");
  if (del) { e.stopPropagation(); e.preventDefault(); swDelete(del.closest(".sw").dataset.sw); return; }
  if (Date.now() - swDragged < 350 && swDraggedEl && swDraggedEl.contains(e.target)) { e.stopPropagation(); e.preventDefault(); return; }  // клик сразу после свайпа этой строки
  if (swOpen) { const inOpen = swOpen.contains(e.target); swClose(); if (inOpen) { e.stopPropagation(); e.preventDefault(); } }
}, true);
function swDelete(key) {

// ---- числа на слух
const DIG = "零一二三四五六七八九";
function num2zh(n) {
  if (n < 10) return DIG[n];
  if (n < 20) return "十" + (n % 10 ? DIG[n % 10] : "");
  if (n < 100) return DIG[Math.floor(n / 10)] + "十" + (n % 10 ? DIG[n % 10] : "");
  const big = (k, name) => { const h = Math.floor(n / k), r = n % k; let s = (h === 2 ? "两" : DIG[h]) + name;
    if (!r) return s; return s + (r < k / 10 ? "零" : "") + (r < 20 && r >= 10 ? "一" : "") + num2zh(r); };
  if (n < 1000) return big(100, "百");
  if (n < 10000) return big(1000, "千");
  return String(n);
}
const NPY = {"零": "líng", "一": "yī", "二": "èr", "两": "liǎng", "三": "sān", "四": "sì", "五": "wǔ", "六": "liù", "七": "qī", "八": "bā", "九": "jiǔ", "十": "shí", "百": "bǎi", "千": "qiān", "块": "kuài"};
const NCY = {"零": "линг", "一": "и", "二": "эр", "两": "лянг", "三": "сан", "四": "сы", "五": "у", "六": "лёу", "七": "чи", "八": "ба", "九": "дзёу", "十": "шы", "百": "бай", "千": "чьен", "块": "куай"};
function zhPy(s) { return [...s].map((c, i) => c === "一" && i < s.length - 1 && "百千".includes(s[i + 1]) ? "yì" : NPY[c]).join(" "); }
function zhCy(s) { return [...s].map(c => NCY[c]).join("-"); }
function numTask() {
  const r = Math.random(); let n, half = false;
  if (r < .25) n = 1 + Math.floor(Math.random() * 20);
  else if (r < .6) n = 20 + Math.floor(Math.random() * 80);
  else if (r < .9) n = 100 + Math.floor(Math.random() * 900);
  else n = 1000 + Math.floor(Math.random() * 9000);
  if (n < 100 && Math.random() < .25) half = true;
  const zh = num2zh(n) + "块" + (half ? "五" : "");
  const fmt = (v, h) => "¥ " + v + (h ? ",5" : "");
  const pool = new Set([fmt(n, half)]);
  const cands = [n + 10, n - 10, n * 10, Math.floor(n / 10) || n + 1, n + 1, Number(String(n).split("").reverse().join("")) || n + 2, n + 100];
  for (const c of shuffle(cands)) { if (pool.size >= 4) break; if (c > 0 && c !== n) pool.add(fmt(c, half)); }
  while (pool.size < 4) pool.add(fmt(n + pool.size * 3, half));
  const opts = shuffle([...pool]);
  return {t: "numq", zh, py: zhPy(zh), cy: zhCy(zh), ru: fmt(n, half), opts, ok: opts.indexOf(fmt(n, half))};
}

// ---- уроки
let lesState = null;  // {l, mode:'theory'|'ex'|'done', list, i, score, wrong, answered}

try { localStorage.removeItem("cn:les"); } catch {}
const lesBest = () => store.get("les2", {});

  lesState = {l: DATA.lessons[n - 1], mode: "theory"};
  navPush(() => { lesState = null; if (view === "les") { drawLessons(); window.scrollTo(0, 0); } });

    box.innerHTML = `<button class="back" data-a="list">‹ Уроки</button><div class="fc" style="min-height:30vh"><div style="font-size:48px">${pct >= 80 ? "🎉" : "💪"}</div><div style="font-size:22px;margin-top:8px">Верно ${S.score} из ${S.list.length}</div><div class="muted" style="margin-top:6px">${S.wrong.length ? "Ошибок: " + S.wrong.length : "Без ошибок"}</div></div>` +

function drawTiles() {

const clean = s => s.replace(/[，。？！、,.?!\s]/g, "");
function feedback(ok, text) {
  const S = lesState; S.answered = true;
  if (ok) S.score++; else S.wrong.push(S.list[S.i]);
  $("fb").innerHTML = `<div class="why" style="border-left:4px solid var(${ok ? "--ok" : "--acc"})"><b>${ok ? "Верно" : "Неверно"}</b>${text ? "<br>" + text : ""}</div>`;

}
function answerEx(i, btn) {

  }

}
function checkOrder() {
  const S = lesState, e = S.list[S.i]; if (S.answered) return;
  if (!S.picked.length) { $("fb").innerHTML = `<div class="why">Сначала соберите фразу из блоков.</div>`; return; }
  const got = clean(S.picked.map(k => e.tiles[k][0]).join(""));
  const right = clean(e.tiles.map(t => t[0]).join(""));
  const ok = got === right || e.alts.some(a => clean(a) === got);
  const full = e.tiles.map(t => t[0]).join("");
  feedback(ok, `<span style="font-size:22px;font-weight:700">${esc(full)}</span> ${sayBtn(full)}<br><span class="py">${esc(e.tiles.map(t => t[1]).join(" "))}</span><br><span class="cy">${esc(e.tiles.map(t => t[2]).join(" "))}</span>` + (e.why ? "<br>" + esc(e.why) : ""));

}

// ---- мои фразы: запрос в приложение Claude (по подписке) → вставка ответа → офлайн
let myAsk = "", myPaste = "", myParsed = null;
function claudePrompt(q) {
  return `Я турист в Китае и не говорю по-китайски. Как сказать по-китайски (путунхуа, разговорный вариант): «${q}»?\n\n` +
    `Ответь только строками формата\n汉字 | pinyin | русский\n\n` +
    `Правила: pinyin с тонами; слоги одного слова пиши слитно (wǒmen, xǐshǒujiān), слова через пробел; ` +
    `изменения тонов уже проставь (bú yào, yíxià, yìdiǎn). Дай 1–3 варианта (короткий и вежливый), ` +
    `затем 1–2 самых вероятных ответа собеседника — пометь их в русском переводе «(слышите)». Без пояснений и без markdown.`;
}
function parseMy(text) {
  const out = [];
  for (let line of String(text).split(/\r?\n/)) {
    line = line.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, "").replace(/`/g, "").trim();
    const parts = line.split(/\s*[|｜]\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 3 || !/[㐀-鿿]/.test(parts[0])) continue;
    const [zh, py, ...ru] = parts;
    const bad = (py.match(/[A-Za-zÀ-ɏ']+/g) || []).filter(w => wordCyr(w) === null && !/^[A-Z]+$|^WiFi$/.test(w));
    out.push({zh, py, ru: ru.join(" | "), cy: toCyr(py), bad});
  }
  return out;
}
function drawMy() {
  const box = $("v-my"), on = navigator.onLine, mine = ALL.filter(c => c.deck === MY);
  let h = `<p class="muted">Нет нужной фразы в разговорнике? Спросите Claude в приложении (по вашей подписке) и вставьте ответ: фраза сохранится на iPhone и будет доступна офлайн — в поиске, карточках и показе крупно. Кириллицу тренажёр посчитает сам.</p>
  <div class="form"><label>1. Что нужно сказать (по-русски)</label><textarea id="my-ask" rows="2" placeholder="у меня аллергия на арахис">${esc(myAsk)}</textarea></div>
  <div class="row"><button class="btn yes" data-m="ask">Спросить Claude</button></div>
  <p class="muted">${on ? "Запрос скопируется в буфер и откроется Claude. Если поле ввода там пустое — вставьте запрос." : "Нужен интернет (из Китая — через VPN)."}</p>
  <div class="form"><label>2. Ответ Claude — строки «汉字 | pinyin | русский»</label><textarea id="my-paste" rows="4" lang="zh">${esc(myPaste)}</textarea></div>
  <div class="row"><button class="btn" data-m="paste">Вставить из буфера</button><button class="btn" data-m="parse">Разобрать</button></div>`;
  if (myParsed) {
    h += myParsed.length ? `<h2>Будет добавлено: ${myParsed.length}</h2>` + myParsed.map(c => `<div class="item${c.zh.length > 5 ? " long" : ""}"><div class="zh">${esc(c.zh)}</div><div class="t"><div class="py">${esc(c.py)}</div><div class="cy">${esc(c.cy)}</div><div>${esc(c.ru)}</div>${c.bad.length ? `<div class="note" style="color:var(--acc)">не разобран pinyin: ${esc(c.bad.join(", "))} — для этих слов кириллицы нет</div>` : ""}</div></div>`).join("") +
      `<div class="row"><button class="btn yes" data-m="save">Сохранить</button><button class="btn" data-m="cancel">Отмена</button></div>`
      : `<div class="why">Не нашёл строк формата «汉字 | pinyin | русский». Попросите Claude ответить в этом формате.</div>`;
  }
  h += `<h2>Сохранено: ${mine.length}</h2>` + (mine.length ? mine.map((c, i) => `<div class="item${c.zh.length > 5 ? " long" : ""}" data-mi="${i}"><div class="zh">${esc(c.zh)}</div><div class="t"><div class="py">${esc(c.py)}</div><div class="cy">${esc(c.cy)}</div><div>${esc(c.ru)}</div></div><button class="say" data-z="${esc(c.zh)}">🔊</button><button class="fav" data-del="${i}" aria-label="Удалить">✕</button></div>`).join("") : `<p class="muted">Пока пусто.</p>`);
  box.innerHTML = h;
  $("my-ask").oninput = e => { myAsk = e.target.value; };
  $("my-paste").oninput = e => { myPaste = e.target.value; };
  box.onclick = e => {
    const d = e.target.closest("[data-del]");
    if (d) { const c = mine[+d.dataset.del]; if (confirm("Удалить «" + c.zh + "»?")) { myList = myList.filter(m => m.zh !== c.zh); store.set("my", myList); syncMy(); drawMy(); } return; }
    if (e.target.closest(".say")) return;
    const it = e.target.closest("[data-mi]"); if (it) return openFull(mine[+it.dataset.mi], mine, +it.dataset.mi);
    const b = e.target.closest("[data-m]"); if (!b) return; const k = b.dataset.m;
    if (k === "ask") {
      const q = myAsk.trim(); if (!q) return $("my-ask").focus();
      const pr = claudePrompt(q);
      // оба вызова синхронно, пока жест пользователя «живой» — иначе iOS блокирует
      try { navigator.clipboard.writeText(pr).catch(() => {}); } catch {}
      window.open("https://claude.ai/new?q=" + encodeURIComponent(pr), "_blank", "noopener");
      return;
    }
    if (k === "paste") {
      if (!navigator.clipboard || !navigator.clipboard.readText) return $("my-paste").focus();
      navigator.clipboard.readText().then(t => { myPaste = t; myParsed = parseMy(t); drawMy(); }).catch(() => $("my-paste").focus());
      return;
    }
    if (k === "parse") myParsed = parseMy(myPaste);
    if (k === "cancel") myParsed = null;
    if (k === "save" && myParsed) {
      for (const c of myParsed) { myList = myList.filter(m => m.zh !== c.zh); myList.push({zh: c.zh, py: c.py, ru: c.ru, t: Date.now()}); }
      store.set("my", myList); syncMy(); myParsed = null; myPaste = ""; myAsk = "";
    }
    drawMy();
  };
}

// ---- главная и поиск по всему
let homeQ = "";
function searchAll(raw) {
  const q = raw.trim(), s = norm(q), s0 = s.replace(/[\s'-]/g, "");
  const hit = (...xs) => xs.some(x => x && (String(x).includes(q) || norm(x).includes(s) || norm(x).replace(/[\s'-]/g, "").includes(s0)));
  const seen = new Set(), ph = [];
  const sc = presetCards().map(c => ({...c, zh: c.zh.join(""), lines: c.zh, deck: c.id.startsWith("place:") ? "Мои места" : "Карточки"}));
  for (const c of [...sc, ...favCards(), ...ALL]) {
    if (seen.has(c.zh + "|" + c.ru)) continue;
    if (hit(c.zh, c.py, c.cy, c.ru)) { seen.add(c.zh + "|" + c.ru); ph.push(c); }
  }
  const starts = c => norm(c.ru).startsWith(s) || norm(c.py).startsWith(s) || c.zh.startsWith(q) ? 0 : 1;
  ph.sort((a, b) => starts(a) - starts(b));
  return {
    ph: ph.slice(0, 60), more: Math.max(0, ph.length - 60),
    gd: DATA.guide.map((g, i) => ({g, i})).filter(x => hit(x.g.title, ...x.g.points)),
    les: DATA.lessons.filter(l => hit(l.title, l.goal)),
  };
}
let homeRes = [];
function drawHomeRes() {
  const r = searchAll(homeQ); homeRes = r.ph;
  let h = "";
  if (r.ph.length) {
    h += `<h2>Фразы и вывески</h2>` + r.ph.map((c, i) => `<div class="ritem" data-ri="${i}"><div class="t"><div class="zh">${esc(c.zh)}</div><div class="m"><span class="py">${esc(c.py || "")}</span> · <span class="cy">${esc(c.cy || "")}</span></div><div class="m">${esc(c.ru)} <span class="muted">· ${esc(c.deck)}</span></div></div><button class="fav${isFav(c) ? " on" : ""}" data-fv="${i}">${isFav(c) ? "★" : "☆"}</button></div>`).join("");
    if (r.more) h += `<p class="muted">…и ещё ${r.more}. Уточните запрос.</p>`;
  }
  if (r.gd.length) h += `<h2>Справка</h2>` + r.gd.map(x => `<button class="rlink" data-go-gd="${x.i}">${esc(x.g.title)}</button>`).join("");
  if (r.les.length) h += `<h2>Уроки</h2>` + r.les.map(l => `<button class="rlink" data-go-les="${l.n}">Урок ${l.n}. ${esc(l.title)}<small>${esc(l.goal)}</small></button>`).join("");
  if (!h) h = `<p class="muted" style="margin-top:14px">Ничего не найдено. Ищите по-русски, pinyin (можно без тонов), кириллицей или иероглифами.</p>`;
  h += `<button class="blk" data-ask="1" style="margin-top:14px"><div class="lbl">Нет нужной фразы?</div><div class="big2">Спросить Claude: «${esc(homeQ.trim())}»</div><div class="muted">Ответ сохраните в «Мои фразы» — будет работать офлайн</div></button>`;
  $("hres").innerHTML = h;
}

const ICON = {taxi: "🗺", nochinese: "🗣", help: "🆘", checkin: "🏨", train: "🚆", food: "🍜", bag: "🧳"};
const DEF_QUICK = [{k: "taxi"}, {k: "show", id: "nochinese"}, {k: "show", id: "help"}];
const BLOCKS = {quick: "Кнопки", fav: "Избранное", recent: "Недавние"};  // «Разделы» (ред. ≤11) — теперь вкладка «Словарь»
const quick = () => store.get("quick", DEF_QUICK);
const layout = () => {
  const l = store.get("homeLayout", {}); const order = (l.order || []).filter(b => BLOCKS[b]); for (const b of Object.keys(BLOCKS)) if (!order.includes(b)) order.push(b);
  let off = (l.off || []).filter(b => BLOCKS[b]); if (order.every(b => off.includes(b))) off = off.filter(b => b !== order[0]);  // хотя бы один блок виден
  return {order, off};
};
const qKey = q => q.k === "taxi" ? "taxi" : q.k === "card" ? "card:" + q.c.id : q.k + ":" + q.id;
function qFromCard(c) {
  const id = String(c.id || "");
  if (id.startsWith("place:")) return {k: "place", id: id.slice(6)};
  if (id.startsWith("show:")) return {k: "show", id: id.slice(5)};
  const lines = [].concat(c.lines || c.zh);
  return {k: "card", c: {id: favId({...c, zh: lines}), zh: lines, py: c.py || "", cy: c.cy || "", ru: c.ru || ""}};
}
const isPinned = c => quick().some(q => qKey(q) === qKey(qFromCard(c)));
function togglePin(c) {
  const k = qKey(qFromCard(c)), q = quick();
  store.set("quick", q.some(x => qKey(x) === k) ? q.filter(x => qKey(x) !== k) : [...q, qFromCard(c)]);
}
function qResolve(q) {  // → {icon, label, card?} или null, если источник удалён
  if (q.k === "taxi") return {icon: "🚕", label: "Такси"};
  if (q.k === "place") { const p = places().find(x => x.id === q.id); return p ? {icon: "📍", label: p.name || "Место", card: placeCard(p)} : null; }
  if (q.k === "show") { const c = DATA.show.find(x => x.id === q.id); return c ? {icon: ICON[c.id] || "💬", label: c.title.replace(/^Такси → /, "Такси: "), card: {...c, id: "show:" + c.id}} : null; }
  const ru = q.c.ru.replace(/\s*\(.*?\)\s*/g, " ").trim();
  return {icon: "💬", label: ru.length > 24 ? ru.slice(0, 22) + "…" : ru, card: {...q.c, lines: q.c.zh, zh: q.c.zh}};
}
function openQuick(i) {
  const q = quick()[i]; if (!q) return;
  if (q.k === "taxi") { placeEdit = null; return go("places"); }
  const r = qResolve(q); if (r && r.card) openFull(r.card, [r.card], 0);
}

function homeEditClick(e) {

  const bl = e.target.closest("[data-blk]"); if (bl) { const L = layout(); L.off = bl.checked ? L.off.filter(x => x !== bl.dataset.blk) : [...L.off, bl.dataset.blk];

// ---- настройки: тема, резервная копия, версия
function setTheme(t) { store.set("theme", t); if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; }
// app: "cn-trainer" — метка формата копии (старое имя проекта); не менять, иначе не восстановятся старые копии
async function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("cn:")) data[k] = localStorage.getItem(k); }
  const text = JSON.stringify({app: "cn-trainer", ver: DATA.built, saved: new Date().toISOString(), data}, null, 1);
  const name = "cn-trainer-" + isoDay(Date.now()) + ".json";
  try {
    const file = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.app !== "cn-trainer" || !j.data) throw new Error("не похоже на копию тренажёра");
      if (!confirm(`Восстановить копию от ${String(j.saved).slice(0, 10)}? Текущий прогресс будет заменён.`)) return;
      for (const k of Object.keys(localStorage)) if (k.startsWith("cn:")) localStorage.removeItem(k);
      for (const [k, v] of Object.entries(j.data)) if (k.startsWith("cn:")) localStorage.setItem(k, v);
      location.reload();
    } catch (e) { alert("Не удалось восстановить: " + e.message); }
  };
  r.readAsText(file);
}

`;
  $("v-set").onclick = e => {

    if (k === "vtest") say("你好，我们是俄罗斯人。");
    if (k === "hard") hardRefresh();

    if (CLR[k] && confirm(CLR[k][1])) { for (const key of CLR[k][0]) localStorage.removeItem("cn:" + key);
      if (k === "clr-places") store.set("places", []);
      location.reload(); }
    if (k === "clr-all" && confirm("Удалить ВСЕ данные приложения на этом устройстве: места, избранное, мои фразы, настройки? Приложение вернётся к исходному состоянию и покажет вводный гайд. Отменить нельзя.")) {
      for (const key of Object.keys(localStorage)) if (key.startsWith("cn:")) localStorage.removeItem(key);
      location.reload();
    }
    if (k === "news") showNews(0);
    if (k === "intro") showIntro();
  };
  $("impf").onchange = e => e.target.files[0] && importData(e.target.files[0]);
  $("vsel") && ($("vsel").onchange = e => { store.set("voice", e.target.value); pickVoice(); say("你好"); });

function voiceHtml() {
  const vs = zhVoices(), want = store.get("voice", ""), rate = store.get("rate", 0.8);
  const list = vs.length ? `<div class="erow"><select id="vsel"><option value="">Автоматически${zhVoice ? " (" + esc(zhVoice.name) + ")" : ""}</option>` +
    vs.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === want ? " selected" : ""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("") + `</select></div>`
    : `<p class="muted">Китайских голосов не найдено.</p>`;
  return list + `<div class="erow"><span class="t">Скорость</span><select id="vrate" style="flex:none;width:auto">${[[0.6, "медленно"], [0.8, "спокойно"], [1, "обычно"]].map(([r, t]) => `<option value="${r}"${r === rate ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="row"><button class="btn" data-s="vtest">🔊 Проверить голос</button></div>
    <p class="muted">Браузер видит голосов: ${vs.length}. Если здесь только Tingting, а в настройках iPhone у вас другой голос — это ограничение Safari, см. «Помощь и FAQ».</p>`;
}
async function hardRefresh() {
  if (!navigator.onLine) return alert("Нужен интернет: офлайн-файлы скачиваются заново.");
  if (!confirm("Переустановить офлайн-файлы? Приложение перезапустится. Ваши данные сохранятся.")) return;
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  location.reload();
}

  ["Как быстро найти фразу", `<p>Пишите в поиск на главной: по-русски («вода»), pinyin без тонов («shui»), кириллицей («шуэй») или иероглифами. Нажмите фразу — она откроется крупно: иероглифы, pinyin, кириллица «как слышится», перевод и 🔊.</p><p>Весь разговорник по разделам — вкладка «Словарь» (разделы по алфавиту, внутри — поиск по разделу).</p><p>Нет нужной фразы — внизу результатов «Спросить Claude»: ответ сохраняется в «Мои фразы» и дальше работает без интернета.</p>`],
  ["Как показать фразу собеседнику", `<p>Нажмите фразу — откроется крупно на белом фоне. A+ / A− — размер, «Поворот» — горизонтально, свайп — соседние фразы. Пока карточка открыта, экран не гаснет (на iPhone с iOS 18.4 и новее).</p>`],
  ["Такси: свои адреса", `<p>Кнопка «Такси» на главной → список мест. «+ Добавить место»: название по-русски для себя, название и адрес иероглифами (скопируйте из подтверждения брони или карты, или попросите на ресепшн написать). Нажали место — карточка для водителя с адресом.</p><p>Нет адреса — «Покажу на карте»: фраза «отвезите сюда, покажу на карте».</p><p>Править — кнопка ✎ справа, удалить — свайп влево по месту → «Удалить».</p>`],
  ["Как настроить главную", `<p>Внизу главной — «⚙ Настроить главную»: какие блоки показывать (кнопки, избранное, недавние) и в каком порядке, какие кнопки наверху. Один блок всегда остаётся. Разделы фраз — во вкладке «Словарь».</p><p>Любую фразу или место можно сделать кнопкой: откройте крупно и нажмите 📌. Нажмите 📌 ещё раз — кнопка уберётся.</p>`],
  ["Что во вкладке «Показать»", `<p>Только ваше избранное. Нажмите ☆ на фразе (в поиске, Словаре, при показе крупно) — она появится там и в блоке «Избранное» на главной. Пустое избранное — на главной кнопка «＋ Добавить в избранное», она откроет Словарь.</p>`],
  ["Жесты", `<ul><li><b>Назад</b> — свайп от самого левого края экрана вправо (как в приложениях iOS) или кнопка «‹ …» сверху.</li><li><b>Удалить</b> из избранного, недавних или моих мест — свайп по строке влево → «Удалить».</li><li><b>Показ крупно</b> — свайп влево / вправо листает соседние фразы.</li><li><b>Карточки</b> — свайп влево — дальше, вправо — назад.</li><li>Двойной тап страницу не увеличивает; если нужно крупнее — A+ в показе крупно.</li></ul>`],
  ["Карточки для заучивания", `<p>«Ещё → Карточки». Сверху выберите колоду. На карточке иероглифы и pinyin; нажмите — кириллица, перевод и звук. «Дальше» / «Назад» или свайп. Знакомое — «Знаю — не показывать»; вернуть — «Скрытые».</p>`],
  ["Нет звука", `<ul><li>Выключите беззвучный режим iPhone: в беззвучном режиме Safari не воспроизводит озвучку.</li><li>Проверьте громкость или подключите наушники.</li><li>«Ещё → Настройки → Голос → Проверить голос». Если голосов 0 — скачайте китайский голос в настройках iPhone: Универсальный доступ → раздел озвучивания текста (Spoken Content / Read &amp; Speak) → Голоса → Китайский.</li></ul>`],
  ["Всегда звучит Tingting, хотя в настройках iPhone другой голос", `<p>Веб-приложениям Safari на iPhone доступна только часть голосов iOS: скачанные и улучшенные голоса из настроек обычно не видны. Apple в ответе разработчикам пишет, что Web Speech API получает только предустановленные голоса. Поэтому для китайского часто доступна одна Tingting.</p><p>Что можно сделать: «Ещё → Настройки → Голос» — если там есть другие китайские голоса, выберите. Там же можно сделать речь медленнее.</p><p>Обход: включите в настройках iPhone «Проговаривание» (Speak Selection) в том же разделе озвучивания текста. Тогда можно выделить текст фразы и нажать «Произнести» — iOS прочитает выбранным в настройках голосом.</p>`],
  ["Как обновить приложение", `<p>При интернете новая версия скачивается сама — внизу появится «Доступна новая версия → Обновить». Вручную: «Ещё → Настройки → Проверить сейчас». Если не помогает или что-то сломалось — «Переустановить офлайн-файлы» (данные сохранятся, нужен интернет).</p>`],
  ["Работает ли без интернета", `<p>Да, всё, кроме «Спросить Claude». Нужно один раз открыть приложение с иконки на экране «Домой» при интернете. Индикатор «онлайн / офлайн» — справа вверху главной.</p>`],
  ["Как установить на iPhone", `<p>Откройте сайт в Safari → «Поделиться» → «На экран „Домой“». Дальше запускайте с иконки.</p>`],
  ["Старые или лишние данные (например, чужой отель в местах)", `<p>Одно место — «Такси» → свайп влево по месту или ✎ → «Удалить место». Всё сразу — «Ещё → Настройки → Сброс данных»: недавние, мои места, главная, скрытые карточки, избранное или все данные.</p>`],
  ["Резервная копия и новый телефон", `<p>Все данные хранятся только на этом устройстве. «Ещё → Настройки → Сохранить копию» — файл в «Файлы»; на новом телефоне — «Восстановить».</p>`],
  ["Кириллица и тоны", `<p>Кириллица — приблизительное звучание, без тонов. Тон показан в pinyin значком над гласной (ā á ǎ à). Правила чтения — «Ещё → Слоги». Если сомневаетесь — просто покажите карточку.</p>`],
];
function drawFaq() {
  $("v-faq").innerHTML = `<h2 style="margin-top:4px">Помощь и FAQ</h2><div class="row" style="margin-bottom:6px"><button class="btn" data-faq="intro" style="font-size:14px">Показать вводный гайд</button><button class="btn" data-faq="news" style="font-size:14px">Что нового</button></div>` + FAQ.map(([q, a]) => `<details><summary>${esc(q)}</summary>${a}</details>`).join("") +
    `<p class="muted" style="margin-top:14px">Не нашли ответ — откройте <a href="https://github.com/Travel-Companions-App/China/issues" target="_blank" rel="noopener" style="color:var(--cy)">issues на GitHub</a>.</p>`;
  $("v-faq").onclick = e => { const b = e.target.closest("[data-faq]"); if (!b) return; if (b.dataset.faq === "intro") showIntro(); else showNews(0); };
}

// ---- вводный гайд (первый запуск) и «Что нового» (после обновления)
const APP_REV = 13;  // номер редакции; cn:ver — последняя редакция, которую видел пользователь (до ред. 12 не хранилась → 11)
const CHANGES = [
  {rev: 13, date: "22.10.2026", items: [
    "«Еда»: как попросить меню и барную карту, виски, бурбон, Jim Beam.",
    "«Количество»: 一杯 (порция) и 一个杯子 (бокал), двойная порция, «две порции в один бокал».",
  ]},
  {rev: 12, date: "22.10.2026", items: [
    "Новая вкладка «Словарь»: все разделы по алфавиту. С главной разделы убраны.",
    "Главная: «Избранное» и «Недавние» с подсказками, ＋ добавляет фразы в избранное через Словарь. Скрыть можно любой блок, один остаётся.",
    "Жесты как в iOS: свайп от левого края — назад; свайп по строке влево — «Удалить» (избранное, недавние, мои места).",
    "Двойной тап больше не увеличивает страницу.",
    "Уроки пересобраны: 12 уроков по ситуациям — знакомство, числа, цены, магазин, такси, поезд, отель, еда. Прогресс старых уроков сброшен.",
    "Словарь: «Слышите в ответ» разнесён по темам, вокзалы — в «Поезде», пауэрбанк — в «Отеле», в «Здоровье» — 110, 120 и 报警.",
    "Вводный гайд и «Что нового» — в «Ещё → Помощь и FAQ».",
  ]},
];
const INTRO = [
  {big: "你好", h: "Помощник по фразам для поездки в Китай", body: `<p>Нужная фраза за пару секунд: иероглифы, pinyin, произношение кириллицей «как слышится» и перевод.</p><p>Покажите фразу собеседнику крупно или включите озвучку. Немного поучиться — тоже здесь: карточки и уроки.</p><p>Работает без интернета. Ваши данные хранятся только на этом телефоне.</p>`},
  {big: "🔎", h: "Главная", body: `<ul><li><b>Поиск</b> — по-русски, pinyin без тонов, кириллицей или иероглифами.</li><li><b>Кнопки</b> сверху — Такси, «Не говорю», «Помощь». Свои — через «⚙ Настроить главную» или 📌 у любой фразы.</li><li><b>★ Избранное</b> — то, что нужно часто. ＋ — добавить.</li><li><b>Недавние</b> — последние открытые фразы.</li></ul>`},
  {big: "A+", h: "Показ крупно", body: `<p>Нажмите фразу — она откроется на весь экран для собеседника.</p><ul><li>A− / A+ — размер, ⟳ — поворот</li><li>🔊 — озвучка (в беззвучном режиме iPhone молчит)</li><li>☆ — в избранное, 📌 — кнопкой на главную</li><li>свайп — соседняя фраза</li></ul>`},
  {big: "词", h: "Нижняя панель", body: `<ul><li><b>Словарь</b> — все разделы по алфавиту.</li><li><b>Показать</b> — избранное карточками.</li><li><b>Ещё</b> — Мои места (адреса для такси), Карточки, Уроки, Справка, Настройки, Помощь.</li></ul><p>Назад — свайп от левого края экрана. Удалить строку — свайп по ней влево.</p>`},
];
let introI = 0, introDone = null;
function overlayOpen() { if ($("intro").classList.contains("hide")) { $("intro").classList.remove("hide"); navPush(overlayCloseNow); } }
function overlayCloseNow() { if ($("intro").classList.contains("hide")) return; $("intro").classList.add("hide"); $("intro").innerHTML = ""; const f = introDone; introDone = null; if (f) f(); }
function overlayClose() { if (!navBack()) overlayCloseNow(); }
function showIntro() { introI = 0; overlayOpen(); drawIntro(); }
function drawIntro() {
  const s = INTRO[introI], last = introI === INTRO.length - 1, I = $("intro");
  I.dataset.mode = "intro";
  I.innerHTML = `<div class="itop"><button data-in="skip"${last ? ' class="hide"' : ""}>Пропустить</button></div><div class="ibody"><div class="ibig">${s.big}</div><h3>${s.h}</h3>${s.body}</div>` +
    `<div class="dots">${INTRO.map((_, i) => `<i class="${i === introI ? "on" : ""}"></i>`).join("")}</div>` +
    `<div class="row" style="margin:0">${introI ? `<button class="btn" data-in="prev">‹ Назад</button>` : ""}<button class="btn yes" data-in="next">${last ? "Начать" : "Далее ›"}</button></div>`;
}
function showNews(seen) {
  const list = CHANGES.filter(c => c.rev > seen).sort((a, b) => b.rev - a.rev), I = $("intro");
  overlayOpen(); I.dataset.mode = "news";
  I.innerHTML = `<div class="itop"></div><div class="ibody" style="justify-content:flex-start"><div class="ibig" style="font-size:40px">✨</div><h3>${seen ? "Обновление установлено" : "Что нового"}</h3>` +
    list.map(c => `<p><b>Версия ${c.rev}</b> · ${esc(c.date)}</p><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("") +
    `<p class="ver">Установлена версия ${APP_REV} (${esc(DATA.built)}). Список изменений — «Ещё → Помощь и FAQ → Что нового».</p></div><div class="row" style="margin:0"><button class="btn yes" data-in="ok">Понятно</button></div>`;
}
$("intro").onclick = e => {
  const b = e.target.closest("[data-in]"); if (!b) return; const k = b.dataset.in;
  if (k === "skip" || k === "ok" || (k === "next" && introI === INTRO.length - 1)) return overlayClose();
  if (k === "next") introI++; if (k === "prev") introI = Math.max(0, introI - 1);
  drawIntro();
};
function startupNotes() {
  if (!store.get("onboarded", 0)) {
    if (FRESH) { introDone = () => { store.set("onboarded", 1); store.set("ver", APP_REV); }; return showIntro(); }
    store.set("onboarded", 1);  // приложением уже пользовались до ред. 12 — гайд не показываем
  }
  const seen = store.get("ver", 11);
  if (seen < APP_REV) { store.set("ver", APP_REV); showNews(seen); }
}

$("deck").onchange = () => { store.set("deck", $("deck").value); resetCards(); render(); };
function render() {
  if (view === "home") drawHome();
  if (view === "places") drawPlaces();
  if (view === "my") drawMy();
  if (view === "set") drawSettings();
  if (view === "faq") drawFaq();
  if (view === "show") drawShows();
  if (view === "les") drawLessons();
  if (view === "gd") drawGuide();
  if (view === "learn") { if (!cur || !visibleCards().some(c => c.id === cur.id)) { resetCards(); nextCard(); } else drawCard(); }
  if (view === "quiz") newQ();
  if (view === "dict") drawDict();
  if (view === "list") drawList();
  if (view === "syl") drawSyl();
}
$("deck").parentElement.classList.add("hide");
$("lesdesc").textContent = `${DATA.lessons.length} уроков по ситуациям: знакомство, цены, магазин, такси, поезд, отель, еда`;
render();
onSwipe($("intro"), d => { if ($("intro").dataset.mode !== "intro") return; introI = Math.max(0, Math.min(INTRO.length - 1, introI - d)); drawIntro(); });
startupNotes();

// ---- офлайн-кэш и обновления: новая версия ставится в фоне, страница предлагает перезапуск
let swReg = null;
if ("serviceWorker" in navigator) {
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl) $("upd").classList.remove("hide"); });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; if (navigator.onLine) r.update().catch(() => {}); }).catch(() => {}));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && swReg && navigator.onLine) swReg.update().catch(() => {}); });
}
$("updgo").onclick = () => location.reload();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
</script>
</body>
</html>
