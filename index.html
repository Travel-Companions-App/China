<header><select id="deck"></select><div class="voice muted" id="vstat"></div></header>
<noscript><p style="padding:16px">Офлайн-разговорник китайского для туриста: фразы с иероглифами, pinyin и произношением кириллицей, карточки для таксиста, уроки и справочник. Для работы включите JavaScript. Исходники и описание: <a href="https://github.com/aleksandrkaiser/china-travel-companion">github.com/aleksandrkaiser/china-travel-companion</a>.</p></noscript>
<main>
  <section id="v-home" class="home"></section>
  <section id="v-show" class="hide">

    <div id="shows"></div>
  </section>
  <section id="v-learn" class="hide">
    <div class="srsrow" id="lstat"></div>
    <label class="muted"><input type="checkbox" id="rev"> Наоборот: русский → китайский</label><br><label class="muted"><input type="checkbox" id="pyf"> Pinyin сразу (вместе с иероглифами)</label>
    <div class="fc" id="fc" style="margin-top:10px"></div>
    <div class="row"><button class="btn" id="bBack">‹ Назад</button><button class="btn" id="bSay" style="flex:.6">🔊</button><button class="btn yes" id="bNext">Дальше ›</button></div>
    <div class="row"><button class="btn" id="bHide">Знаю — не показывать</button></div>
    <p class="muted" style="text-align:center;margin:8px 0 0">Нажмите карточку — перевод и произношение. Свайп влево — дальше, вправо — назад.</p>
    <div class="row"><button class="btn" id="bHidden" style="font-size:14px"></button></div>
    <div id="lhid"></div>
  </section>
  <section id="v-quiz" class="hide">
    <div class="muted" id="qstat"></div>
    <div class="fc" id="qcard" style="min-height:26vh;margin-top:8px"></div>
    <div class="opts" id="qopts"></div>
    <div class="row"><button class="btn" id="qNext">Дальше</button></div>
  </section>
  <section id="v-dict" class="hide"></section>

    <input type="search" id="q" placeholder="Поиск в разделе: иероглиф, pinyin, кириллица, русский">
    <div id="list"></div>
  </section>
  <section id="v-les" class="hide"></section>

DGCA61/Agenda%20Item05-Aviation%20Security%20and%20Facilitation/61-IP-05-04-CHN-CHINA-INNOVATIVE-MEASURES-ON-ARRIVAL-CARD-FILING-FOR-FOREIGNERS.pdf", "сентябрь 2026"]]}, {"title": "Перелёты и пауэрбанки", "points": ["Пауэрбанки — только в ручной клади, в сдаваемом багаже запрещены. До 100 Вт·ч — без согласования, 100–160 Вт·ч — с разрешения авиакомпании, больше 160 Вт·ч — нельзя.", "На внутренних рейсах Китая (с 28.06.2025) пауэрбанк без маркировки 3C на корпусе изымают на досмотре. На международных рейсах официально не требуется, но в аэропортах Китая могут проверять на любом досмотре — лучше иметь пауэрбанк с 3C или не брать.", "Лимит количества разные авиакомпании задают по-разному, а правила по 100–160 Вт·ч меняются — уточняйте у перевозчика перед рейсом.", "Из Daxing в город: аэроэкспресс 大兴机场线 — 35 юаней, такси и DiDi — из отдельных зон (出租车 / 网约车).", "Карту прибытия можно заполнить заранее онлайн — см. «Въезд и прилёт»."], "phrases": [["充电宝", "chōngdiànbǎo", "чонг-дьен-бао", "пауэрбанк"], ["充电宝拿出来", "chōngdiànbǎo ná chūlai", "чонг-дьен-бао на чу-лай", "достаньте пауэрбанк"], ["托运", "tuōyùn", "туо-юн", "сдача багажа"], ["登机口", "dēngjīkǒu", "дэнг-дзи-коу", "выход на посадку"], ["大兴机场线", "Dàxīng jīchǎng xiàn", "да-синг дзи-чанг сьен", "аэроэкспресс Daxing"]], "sources": [["Flight-delayed.com: правила CCC для пауэрбанков", "https://www.flight-delayed.com/en-gb/blog/2026/06/03/ccc-power-bank-certification-on-china-flights-everything-you-need-to-know", "03.06.2026"], ["Trip.com: лимиты пауэрбанков в Китае", "https://au.trip.com/guide/info/china-power-bank-limit.html", "дата не указана"], ["Wander in China: метро Пекина (тариф аэроэкспресса)", "https://www.wanderinchina.com/destinations/beijing/transport/metro/", "23.06.2026"]]}, {"title": "Alipay: как платить", "points": ["Два способа. «Я сканирую вас» (我扫你): кнопка «Сканировать», QR продавца, вводите сумму и 6-значный пароль — так в маленьких лавках и у уличной еды. «Вы сканируете меня» (你扫我): показываете свой код оплаты — в сетевых магазинах и кафе.", "Иностранная карта, привязанная напрямую: до 200 юаней за операцию — без комиссии, свыше — 3% от всей суммы. Порог считается на каждую покупку, не за день.", "Нужна проверка личности (паспорт + лицо), она может занять до 24 часов. Переводы людям и «красные конверты» с иностранной картой недоступны — только оплата зарегистрированным продавцам.", "Новому аккаунту при крупной покупке может прийти «System Busy» — начните с мелких оплат."], "phrases": [["我扫你", "wǒ sǎo nǐ", "во сао ни", "я сканирую ваш QR"], ["你扫我", "nǐ sǎo wǒ", "ни сао во", "сканируйте мой код"], ["付款码", "fùkuǎnmǎ", "фу-куан-ма", "код оплаты"], ["扫码", "sǎo mǎ", "сао ма", "сканировать QR"], ["可以用支付宝吗？", "kěyǐ yòng Zhīfùbǎo ma?", "кэ-и ёнг джы-фу-бао ма?", "можно Alipay?"]], "sources": [["Wander in China: Alipay для иностранцев", "https://www.wanderinchina.com/survival-guide/payment/alipay/", "06.02.2026"]]}, {"title": "Такси и DiDi", "points": ["Удобнее всего — DiDi внутри Alipay (раздел «Транспорт» или иконка DiDi): оплата спишется с привязанной карты, наличные не принимают.", "Точку посадки (зелёная точка) ставьте у входа в отель или на углу и идите туда — водитель едет к точке, а не к вам. В аэропортах и на вокзалах подача — в отдельной зоне, указатели 网约车, часто в паркинге.", "Не отвечайте на звонки водителя, если не говорите по-китайски: в чате есть готовое сообщение «я иностранец, следуйте навигации». Сообщения водителя переводятся кнопкой «Translate».", "Обычное такси в Пекине: посадка 13 юаней за первые 3 км, далее 2,3 юаня/км, плюс 1 юань топливный сбор; бывают надбавки за ожидание в пробке и ночью.", "Водитель DiDi может спросить последние цифры вашего телефона (尾号) — называйте по одной цифре [из памяти]."], "phrases": [["网约车", "wǎngyuēchē", "ванг-юэ-чэ", "такси по приложению"], ["上车点", "shàngchēdiǎn", "шанг-чэ-дьен", "точка посадки"], ["我到了", "wǒ dào le", "во дао лэ", "я на месте (пишет водитель)"], ["有点堵", "yǒudiǎn dǔ", "ёу-дьен ду", "небольшая пробка"], ["尾号", "wěihào", "вэй-хао", "последние цифры номера"], ["请打表", "qǐng dǎbiǎo", "чинг да-бяо", "включите счётчик, пожалуйста [из памяти]"]], "sources": [["Wander in China: DiDi для иностранцев", "https://wanderinchina.com/survival-guide/useful-mobile-apps/didi-chuxing/", "05.02.2026"], ["China Daily (chinaservicesinfo): тарифы транспорта Пекина", "https://www.chinaservicesinfo.com/s/202608/04/WS6a718936498e23165e0719ae/im-planning-to-visit-beijing-in-september-and-want-to-know-how-public-transportation-fares-work-i-want-to-make-sure-i-budget-everything-properly.html", "04.08.2026"]]}, {"title": "Метро (Пекин)", "points": ["На входе в каждую станцию — досмотр: сумку на ленту, рамка, иногда ручной металлоискатель. Вода, кофе и еда разрешены; аэрозоли, горючее и большие ножи отберут.", "Оплата: бесконтактная Visa/Mastercard/AmEx/JCB или Apple Pay — к жёлтому считывателю турникета на входе и на выходе. Или Alipay → «Транспорт» → выбрать город → включить QR метро. В каждом городе своя карта: при переезде переключите город.", "Тариф по расстоянию: до 6 км — 3 юаня, 6–12 — 4, 12–22 — 5, 22–32 — 6, далее +1 юань за каждые 20 км. Аэроэкспресс до Daxing — 35 юаней.", "Поезда ходят примерно с 5:00 до 23:30; первый и последний поезд зависят от линии.", "Выходы со станции обозначены буквами и цифрами: A口, B口, C1口 — заранее посмотрите на карте, какой выход ближе к цели."], "phrases": [["安检", "ānjiǎn", "ан-дзьен", "досмотр"], ["进站 / 出站", "jìnzhàn / chūzhàn", "дзин-джан / чу-джан", "вход / выход"], ["换乘", "huànchéng", "хуан-чэнг", "пересадка"], ["号线", "hàoxiàn", "хао-сьен", "линия (7号线 — линия 7)"], ["口", "kǒu", "коу", "выход (A口 — выход A)"]], "sources": [["Wander in China: метро Пекина", "https://www.wanderinchina.com/destinations/beijing/transport/metro/", "23.06.2026"], ["China Daily (chinaservicesinfo): тарифы метро Пекина", "https://www.chinaservicesinfo.com/s/202608/04/WS6a718936498e23165e0719ae/im-planning-to-visit-beijing-in-september-and-want-to-know-how-public-transportation-fares-work-i-want-to-make-sure-i-budget-everything-properly.html", "04.08.2026"]]}, {"title": "Поезда", "points": ["Билет — это паспорт. Имя в брони должно точно совпадать с паспортом (латиница как в машиночитаемой строке).", "Приезжайте минимум за 30 минут, на первый поезд — за час. Посадка через 检票口 обычно открывается за 15–20 минут и закрывается примерно за 5 минут до отправления.", "Автоматы на входе читают иностранный паспорт не везде. Если не прошло — идите в 人工通道 (проход с сотрудником): паспорт сканируют вручную. Держите под рукой подтверждение брони.", "Пауэрбанки больше 100 Вт·ч (≈27 000 мА·ч) на досмотре изымают.", "На вокзалах и в поездах есть краны с кипятком 开水 — можно заварить чай или лапшу [из памяти]."], "phrases": [["检票口", "jiǎnpiàokǒu", "дзьен-пяо-коу", "выход на посадку"], ["人工通道", "réngōng tōngdào", "жэн-гонг тонг-дао", "проход с сотрудником"], ["停止检票", "tíngzhǐ jiǎnpiào", "тинг-джы дзьен-пяо", "посадка окончена"], ["候车室", "hòuchēshì", "хоу-чэ-шы", "зал ожидания"], ["车厢", "chēxiāng", "чэ-сянг", "вагон"], ["开水", "kāishuǐ", "кай-шуэй", "кипяток"]], "sources": [["Hidden China Travel: поезда для иностранцев", "https://hiddenchinatravel.com/book-china-high-speed-rail-foreigners", "01.08.2026"]]}, {"title": "Отель", "points": ["Регистрацию иностранца в полиции делает сам отель — по паспорту при заселении. Если ночуете у знакомых, зарегистрироваться нужно в течение 24 часов в местном отделении полиции.", "Обычно берут депозит (押金) и возвращают при выезде [из памяти].", "Обычно в номере дают две бутылки воды в день бесплатно."], "phrases": [["入住", "rùzhù", "жу-джу", "заселение"], ["退房", "tuìfáng", "туэй-фанг", "выселение"], ["押金", "yājīn", "я-дзин", "депозит"], ["前台", "qiántái", "чьен-тай", "ресепшн"], ["寄存行李", "jìcún xíngli", "дзи-цун синг-ли", "оставить багаж"]], "sources": [["NIA: регистрация проживания иностранцев", "https://en.nia.gov.cn/n167/n247/n10178/c68246/content.html", "дата не указана"], ["The Helpful Panda: 40 China travel tips", "https://thehelpfulpanda.com/china-travel-tips/", "обновлено 16.02.2026"]]}, {"title": "Вода, еда, туалеты", "points": ["Воду из-под крана не пьют. Пейте бутилированную или кипячёную; в общественных местах есть раздатчики горячей воды — холодное питьё в Китае не принято.", "В общественных туалетах часто нет бумаги, а иногда и мыла: носите салфетки и антисептик.", "Чаевые не приняты.", "В ресторанах обычно только палочки — вилку можно попросить, но она есть не везде.", "На рынках торг ожидается; в магазинах и кафе цены фиксированные."], "phrases": [["矿泉水", "kuàngquánshuǐ", "куанг-чюэн-шуэй", "бутилированная вода"], ["纸巾", "zhǐjīn", "джы-дзин", "салфетки"], ["卫生间在哪儿？", "wèishēngjiān zài nǎr?", "вэй-шэнг-дзьен дзай нар?", "где туалет?"], ["筷子", "kuàizi", "куай-дзы", "палочки"], ["有叉子吗？", "yǒu chāzi ma?", "ёу ча-дзы ма?", "есть вилка?"]], "sources": [["The Helpful Panda: 40 China travel tips", "https://thehelpfulpanda.com/china-travel-tips/", "обновлено 16.02.2026"]]}, {"title": "Связь и интернет", "points": ["Мобильный интернет по роумингу или туристической eSIM обычно идёт через шлюз за пределами Китая — Google и WhatsApp работают без VPN.", "Но только по мобильным данным: Wi-Fi отеля, аэропорта, кафе — это китайская сеть, там нужен VPN. С местной китайской SIM-картой VPN нужен всегда.", "Пауэрбанк можно взять в аренду почти везде (充电宝) — через QR в Alipay [из памяти]."], "phrases": [["WiFi密码是多少？", "WiFi mìmǎ shì duōshao?", "WiFi ми-ма шы дуо-шао?", "какой пароль Wi-Fi?"], ["充电宝", "chōngdiànbǎo", "чонг-дьен-бао", "пауэрбанк"], ["手机没电了", "shǒujī méi diàn le", "шоу-дзи мэй дьен лэ", "телефон разрядился"], ["没有信号", "méiyǒu xìnhào", "мэй-ёу син-хао", "нет сигнала"]], "sources": [["Jetpac: eSIM в Китае", "https://www.jetpacglobal.com/blog/best-esim-for-china/", "16.06.2026, изм. 24.08.2026"]]}, {"title": "Розетки", "points": ["220 В, 50 Гц. Встречаются вилки трёх типов: A (две плоские), C (две круглые, европейская), I (три плоские треугольником — основной китайский стандарт).", const SYL = new Map(); for (const [, list] of DATA.syllables) for (const [p, c] of list) SYL.set(p, c);
const stripTones = t => t.normalize("NFD").replace(/[\u0300-\u0307\u0309-\u036f]/g, "").normalize("NFC");  // тоны долой, ü (U+0308) оставляем
function segment(w) {

  for (let i = 0; i < w.length; i++) {

    for (let L = 1; L <= Math.min(6, w.length - i); L++) {
      const p = w.slice(i, i + L);
      if (SYL.has(p) && (!best[i + L] || best[i].length + 1 < best[i + L].length)) best[i + L] = best[i].concat(p);

  return best[w.length] || null;
}

    if (!seg) return null;
    const cy = seg.map(x => SYL.get(x)); cy[cy.length - 1] += er; parts.push(...cy);

}

// ---- навигация «назад» как в iOS: каждый переход вглубь пишется в историю браузера (pushState),
// поэтому системный свайп от левого края в установленном приложении возвращает на шаг назад (popstate).
// Кнопки «‹ …» и ✕ делают то же через navBack(). Смена вкладки сбрасывает стек.
const NAV = {stack: [], silent: 0};
try { history.replaceState({d: 0}, ""); } catch {}
function navPush(undo) { NAV.stack.push(undo); try { history.pushState({d: NAV.stack.length}, ""); } catch {} }
function navBack(n = 1) {
  n = Math.min(n, NAV.stack.length); if (!n) return false;
  const fs = NAV.stack.splice(NAV.stack.length - n).reverse();
  NAV.silent++; try { history.go(-n); } catch { NAV.silent--; }
  for (const f of fs) { try { f(); } catch {} }
  return true;
}
function navReset() { const n = NAV.stack.length; if (!n) return; NAV.stack = []; NAV.silent++; try { history.go(-n); } catch { NAV.silent--; } }
window.addEventListener("popstate", e => {
  if (NAV.silent) { NAV.silent--; return; }
  const d = (e.state && e.state.d) || 0;
  while (NAV.stack.length > d) { const f = NAV.stack.pop(); try { f(); } catch {} }
});

const PARENT = {list: "dict", learn: "more", quiz: "more", syl: "more", places: "more", set: "more", my: "more", les: "more", gd: "more", faq: "more"};

  }
  view = v;
  for (const x of document.querySelectorAll("#tabs button")) x.classList.toggle("on", x.dataset.v === tabOf(v));

}

// ---- числа на слух
const DIG = "零一二三四五六七八九";
function num2zh(n) {
  if (n < 10) return DIG[n];
  if (n < 20) return "十" + (n % 10 ? DIG[n % 10] : "");
  if (n < 100) return DIG[Math.floor(n / 10)] + "十" + (n % 10 ? DIG[n % 10] : "");
  const big = (k, name) => { const h = Math.floor(n / k), r = n % k; let s = (h === 2 ? "两" : DIG[h]) + name;
    if (!r) return s; return s + (r < k / 10 ? "零" : "") + (r < 20 && r >= 10 ? "一" : "") + num2zh(r); };
  if (n < 1000) return big(100, "百");
  if (n < 10000) return big(1000, "千");
  return String(n);
}
const NPY = {"零": "líng", "一": "yī", "二": "èr", "两": "liǎng", "三": "sān", "四": "sì", "五": "wǔ", "六": "liù", "七": "qī", "八": "bā", "九": "jiǔ", "十": "shí", "百": "bǎi", "千": "qiān", "块": "kuài"};
const NCY = {"零": "линг", "一": "и", "二": "эр", "两": "лянг", "三": "сан", "四": "сы", "五": "у", "六": "лёу", "七": "чи", "八": "ба", "九": "дзёу", "十": "шы", "百": "бай", "千": "чьен", "块": "куай"};
function zhPy(s) { return [...s].map((c, i) => c === "一" && i < s.length - 1 && "百千".includes(s[i + 1]) ? "yì" : NPY[c]).join(" "); }
function zhCy(s) { return [...s].map(c => NCY[c]).join("-"); }
function numTask() {
  const r = Math.random(); let n, half = false;
  if (r < .25) n = 1 + Math.floor(Math.random() * 20);
  else if (r < .6) n = 20 + Math.floor(Math.random() * 80);
  else if (r < .9) n = 100 + Math.floor(Math.random() * 900);
  else n = 1000 + Math.floor(Math.random() * 9000);
  if (n < 100 && Math.random() < .25) half = true;
  const zh = num2zh(n) + "块" + (half ? "五" : "");
  const fmt = (v, h) => "¥ " + v + (h ? ",5" : "");
  const pool = new Set([fmt(n, half)]);
  const cands = [n + 10, n - 10, n * 10, Math.floor(n / 10) || n + 1, n + 1, Number(String(n).split("").reverse().join("")) || n + 2, n + 100];
  for (const c of shuffle(cands)) { if (pool.size >= 4) break; if (c > 0 && c !== n) pool.add(fmt(c, half)); }
  while (pool.size < 4) pool.add(fmt(n + pool.size * 3, half));
  const opts = shuffle([...pool]);
  return {t: "numq", zh, py: zhPy(zh), cy: zhCy(zh), ru: fmt(n, half), opts, ok: opts.indexOf(fmt(n, half))};
}

function parseMy(text) {
  const out = [];

    const parts = line.split(/\s*[|｜]\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 3 || !/[㐀-鿿]/.test(parts[0])) continue;
    const [zh, py, ...ru] = parts;
    const bad = (py.match(/[A-Za-zÀ-ɏ']+/g) || []).filter(w => wordCyr(w) === null && !/^[A-Z]+$|^WiFi$/.test(w));
    out.push({zh, py, ru: ru.join(" | "), cy: toCyr(py), bad});
  }
  return out;
}

let homeQ = "";
function searchAll(raw) {
  const q = raw.trim(), s = norm(q), s0 = s.replace(/[\s'-]/g, "");
  const hit = (...xs) => xs.some(x => x && (String(x).includes(q) || norm(x).includes(s) || norm(x).replace(/[\s'-]/g, "").includes(s0)));
  const seen = new Set(), ph = [];
  const sc = presetCards().map(c => ({...c, zh: c.zh.join(""), lines: c.zh, deck: c.id.startsWith("place:") ? "Мои места" : "Карточки"}));
  for (const c of [...sc, ...favCards(), ...ALL]) {
    if (seen.has(c.zh + "|" + c.ru)) continue;
    if (hit(c.zh, c.py, c.cy, c.ru)) { seen.add(c.zh + "|" + c.ru); ph.push(c); }
  }
  const starts = c => norm(c.ru).startsWith(s) || norm(c.py).startsWith(s) || c.zh.startsWith(q) ? 0 : 1;
  ph.sort((a, b) => starts(a) - starts(b));

    ph: ph.slice(0, 60), more: Math.max(0, ph.length - 60),
    gd: DATA.guide.map((g, i) => ({g, i})).filter(x => hit(x.g.title, ...x.g.points)),

    <div class="row"><button class="btn" data-s="clr-recent" style="font-size:14px">Очистить недавние</button><button class="btn" data-s="clr-places" style="font-size:14px">Удалить все мои места</button></div>
    <div class="row"><button class="btn" data-s="clr-home" style="font-size:14px">Главная как было</button><button class="btn" data-s="clr-hidden" style="font-size:14px">Вернуть скрытые карточки</button></div>
    <div class="row"><button class="btn" data-s="clr-favs" style="font-size:14px">Очистить избранное</button><button class="btn no" data-s="clr-all" style="font-size:14px">Удалить все данные</button></div>
    <h2>О приложении</h2><p class="muted">Открытый проект: <a href="https://github.com/aleksandrkaiser/china-travel-companion" target="_blank" rel="noopener" style="color:var(--cy)">github.com/aleksandrkaiser/china-travel-companion</a> · лицензия MIT.</p>
`;
  $("v-set").onclick = e => {
    const th = e.target.closest("[data-th]"); if (th) { setTheme(th.dataset.th); return drawSettings(); }
    const b = e.target.closest("[data-s]"); if (!b) return; const k = b.dataset.s;
    if (k === "exp") exportData();
    if (k === "imp") $("impf").click();
    if (k === "upd") { $("updst").textContent = navigator.onLine ? "Проверяю…" : "Нет интернета."; if (swReg && navigator.onLine) swReg.update().then(() => { setTimeout(() => { if ($("updst")) $("updst").textContent = $("upd").classList.contains("hide") ? "Установлена последняя версия." : "Есть новая версия — нажмите «Обновить» внизу."; }, 2500); }).catch(() => { $("updst").textContent = "Не удалось проверить."; }); }
    if (k === "vtest") say("你好，我们是俄罗斯人。");
    if (k === "hard") hardRefresh();
    const CLR = {"clr-recent": [["recent"], "Очистить недавние?"], "clr-places": [["places", "trips"], "Удалить все мои места? Кнопки такси к конкретным местам тоже пропадут."],
      "clr-home": [["quick", "homeLayout"], "Вернуть кнопки и порядок блоков главной как было?"], "clr-hidden": [["hidden"], "Вернуть все скрытые карточки?"],
      "clr-favs": [["favs"], "Очистить избранное (и вкладку «Показать»)?"]};
    if (CLR[k] && confirm(CLR[k][1])) { for (const key of CLR[k][0]) localStorage.removeItem("cn:" + key);
      if (k === "clr-places") store.set("places", []);
      location.reload(); }
    if (k === "clr-all" && confirm("Удалить ВСЕ данные приложения на этом устройстве: места, избранное, мои фразы, настройки? Приложение вернётся к исходному состоянию и покажет вводный гайд. Отменить нельзя.")) {
      for (const key of Object.keys(localStorage)) if (key.startsWith("cn:")) localStorage.removeItem(key);
      location.reload();
    }
    if (k === "news") showNews(0);
    if (k === "intro") showIntro();
  };
  $("impf").onchange = e => e.target.files[0] && importData(e.target.files[0]);
  $("vsel") && ($("vsel").onchange = e => { store.set("voice", e.target.value); pickVoice(); say("你好"); });
  $("vrate") && ($("vrate").onchange = e => { store.set("rate", +e.target.value); say("你好，谢谢。"); });
}
function voiceHtml() {
  const vs = zhVoices(), want = store.get("voice", ""), rate = store.get("rate", 0.8);
  const list = vs.length ? `<div class="erow"><select id="vsel"><option value="">Автоматически${zhVoice ? " (" + esc(zhVoice.name) + ")" : ""}</option>` +
    vs.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === want ? " selected" : ""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("") + `</select></div>`
    : `<p class="muted">Китайских голосов не найдено.</p>`;
  return list + `<div class="erow"><span class="t">Скорость</span><select id="vrate" style="flex:none;width:auto">${[[0.6, "медленно"], [0.8, "спокойно"], [1, "обычно"]].map(([r, t]) => `<option value="${r}"${r === rate ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="row"><button class="btn" data-s="vtest">🔊 Проверить голос</button></div>
    <p class="muted">Браузер видит голосов: ${vs.length}. Если здесь только Tingting, а в настройках iPhone у вас другой голос — это ограничение Safari, см. «Помощь и FAQ».</p>`;
}
async function hardRefresh() {
  if (!navigator.onLine) return alert("Нужен интернет: офлайн-файлы скачиваются заново.");
  if (!confirm("Переустановить офлайн-файлы? Приложение перезапустится. Ваши данные сохранятся.")) return;
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  location.reload();
}

let introI = 0, introDone = null;
function overlayOpen() { if ($("intro").classList.contains("hide")) { $("intro").classList.remove("hide"); navPush(overlayCloseNow); } }
function overlayCloseNow() { if ($("intro").classList.contains("hide")) return; $("intro").classList.add("hide"); $("intro").innerHTML = ""; const f = introDone; introDone = null; if (f) f(); }
function overlayClose() { if (!navBack()) overlayCloseNow(); }
function showIntro() { introI = 0; overlayOpen(); drawIntro(); }
function drawIntro() {
  const s = INTRO[introI], last = introI === INTRO.length - 1, I = $("intro");
  I.dataset.mode = "intro";
  I.innerHTML = `<div class="itop"><button data-in="skip"${last ? ' class="hide"' : ""}>Пропустить</button></div><div class="ibody"><div class="ibig">${s.big}</div><h3>${s.h}</h3>${s.body}</div>` +
    `<div class="dots">${INTRO.map((_, i) => `<i class="${i === introI ? "on" : ""}"></i>`).join("")}</div>` +
    `<div class="row" style="margin:0">${introI ? `<button class="btn" data-in="prev">‹ Назад</button>` : ""}<button class="btn yes" data-in="next">${last ? "Начать" : "Далее ›"}</button></div>`;
}
function showNews(seen) {
  const list = CHANGES.filter(c => c.rev > seen).sort((a, b) => b.rev - a.rev), I = $("intro");
  overlayOpen(); I.dataset.mode = "news";
  I.innerHTML = `<div class="itop"></div><div class="ibody" style="justify-content:flex-start"><div class="ibig" style="font-size:40px">✨</div><h3>${seen ? "Обновление установлено" : "Что нового"}</h3>` +
    list.map(c => `<p><b>Версия ${c.rev}</b> · ${esc(c.date)}</p><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("") +
    `<p class="ver">Установлена версия ${APP_REV} (${esc(DATA.built)}). Список изменений — «Ещё → Помощь и FAQ → Что нового».</p></div><div class="row" style="margin:0"><button class="btn yes" data-in="ok">Понятно</button></div>`;
}
$("intro").onclick = e => {
  const b = e.target.closest("[data-in]"); if (!b) return; const k = b.dataset.in;
  if (k === "skip" || k === "ok" || (k === "next" && introI === INTRO.length - 1)) return overlayClose();
  if (k === "next") introI++; if (k === "prev") introI = Math.max(0, introI - 1);
  drawIntro();
};
function startupNotes() {
  if (!store.get("onboarded", 0)) {
    if (FRESH) { introDone = () => { store.set("onboarded", 1); store.set("ver", APP_REV); }; return showIntro(); }
    store.set("onboarded", 1);  // приложением уже пользовались до ред. 12 — гайд не показываем
  }
  const seen = store.get("ver", 11);
  if (seen < APP_REV) { store.set("ver", APP_REV); showNews(seen); }
}

$("deck").onchange = () => { store.set("deck", $("deck").value); resetCards(); render(); };
function render() {
  if (view === "home") drawHome();

  if (view === "my") drawMy();
  if (view === "set") drawSettings();
  if (view === "faq") drawFaq();
  if (view === "show") drawShows();
  if (view === "les") drawLessons();
  if (view === "gd") drawGuide();
  if (view === "learn") { if (!cur || !visibleCards().some(c => c.id === cur.id)) { resetCards(); nextCard(); } else drawCard(); }
  if (view === "quiz") newQ();
  if (view === "dict") drawDict();
  if (view === "list") drawList();
  if (view === "syl") drawSyl();
}
$("deck").parentElement.classList.add("hide");

render();
onSwipe($("intro"), d => { if ($("intro").dataset.mode !== "intro") return; introI = Math.max(0, Math.min(INTRO.length - 1, introI - d)); drawIntro(); });
startupNotes();

// ---- офлайн-кэш и обновления: новая версия ставится в фоне, страница предлагает перезапуск
let swReg = null;
if ("serviceWorker" in navigator) {
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl) $("upd").classList.remove("hide"); });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; if (navigator.onLine) r.update().catch(() => {}); }).catch(() => {}));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && swReg && navigator.onLine) swReg.update().catch(() => {}); });
}
$("updgo").onclick = () => location.reload();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
