<style>

:root[data-theme=dark]{--bg:#141312;--fg:#efeae3;--muted:#a39d95;--line:#33302c;--card:#1f1e1c;--acc:#ff6b5e;--cy:#7cc0f0;--ok:#5bc48f;--soft:#2a2724;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.4 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}

main{padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}

.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.zh{font-weight:700}
.py{color:var(--acc)}
.cy{color:var(--cy)}
.btn{border:0;border-radius:12px;padding:14px 10px;font:inherit;font-size:16px;background:var(--soft);color:var(--fg);flex:1}

.item.long{flex-wrap:wrap;row-gap:2px}.item.long .zh{flex-basis:100%}
.say{border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}

#full .zh{font-size:calc(clamp(34px,10vw,64px) * var(--fz));line-height:1.3;overflow-wrap:anywhere}
#full.rot .zh{font-size:calc(clamp(34px,10vh,72px) * var(--fz))}
#full .s{color:#555;font-size:16px;margin-top:16px}

#full .fpos{font-size:13px;color:#777}

.fav.on{color:#e0a000}
.home{padding-top:8px}
.hero{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero h1{margin:0;font-size:30px;letter-spacing:-.01em}

.net.on i{background:var(--ok)}
.sub{color:var(--muted);font-size:15px;margin:4px 0 14px}

.qk.main{background:var(--acc);border-color:var(--acc);color:#fff}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%;font:inherit;color:var(--fg);text-align:left;display:block}
.blk .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.res h2:first-child{margin-top:8px}

.ritem .zh{font-size:22px}
.ritem .m{font-size:14px}

.rlink small{display:block;color:var(--muted);font-size:13px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#upd span{flex:1}
#upd button{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;background:var(--acc);color:#fff}
.form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}

.voice{font-size:13px;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;font:inherit;color:var(--fg);text-align:left}
.li .n{font-size:22px;font-weight:700;color:var(--acc);min-width:1.4em;text-align:center}
.li .tt{flex:1}.li .tt div:first-child{font-weight:600}
.li .st{font-size:13px;color:var(--ok);white-space:nowrap}
.back{border:0;background:none;color:var(--acc);font:inherit;font-size:16px;padding:4px 0;margin-bottom:6px}
.th h3{font-size:16px;margin:18px 0 6px;color:var(--acc)}

.ex .zh{font-size:22px;min-width:2.5em}

.ex .note{font-size:13px;color:var(--muted)}
.big{width:100%;margin-top:16px}
.qz{font-size:clamp(30px,10vw,48px);font-weight:700;text-align:center;line-height:1.3}

.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;text-align:left}

.src{font-size:13px;color:var(--muted);margin-top:16px}

.more .li .n{font-size:24px}

<body>
<header><select id="deck"></select><div class="voice muted" id="vstat"></div></header>
<noscript><p style="padding:16px">Офлайн-разговорник китайского для туриста: фразы с иероглифами, pinyin и произношением кириллицей, карточки для таксиста, уроки, диалоги и справочник. Для работы включите JavaScript. Исходники и описание: <a href="https://github.com/aleksandrkaiser/cn-trainer">github.com/aleksandrkaiser/cn-trainer</a>.</p></noscript>
<main>
  <section id="v-home" class="home"></section>
  <section id="v-show" class="hide">
    <p class="muted">Нажмите карточку — откроется крупно, чтобы показать собеседнику. Листайте свайпом.</p>
    <div id="shows"></div>
  </section>
  <section id="v-learn" class="hide">
    <div class="srsrow" id="lstat"></div>
    <div class="bar"><i id="lbar"></i></div>
    <label class="muted"><input type="checkbox" id="rev"> Наоборот: русский → китайский</label>
    <div class="fc" id="fc" style="margin-top:10px"></div>
    <div class="row"><button class="btn no" id="bNo">Не знаю</button><button class="btn" id="bSay">🔊</button><button class="btn yes" id="bYes">Знаю</button></div>
    <p class="muted" style="text-align:center;margin:8px 0 0">Свайп вправо — знаю, влево — не знаю. Знакомые карточки вернутся через 1, 3, 7, 16, 35 дней.</p>
    <div class="row"><button class="btn" id="bReset" style="font-size:14px">Сбросить прогресс колоды</button></div>
  </section>
  <section id="v-quiz" class="hide">
    <div class="muted" id="qstat"></div>
    <div class="fc" id="qcard" style="min-height:26vh;margin-top:8px"></div>
    <div class="opts" id="qopts"></div>
    <div class="row"><button class="btn" id="qNext">Дальше</button></div>
  </section>
  <section id="v-list" class="hide">
    <input type="search" id="q" placeholder="Поиск: иероглиф, pinyin, кириллица, русский">
    <div id="list"></div>
  </section>
  <section id="v-les" class="hide"></section>
  <section id="v-dlg" class="hide"></section>
  <section id="v-gd" class="hide"></section>
  <section id="v-more" class="hide more">
    <button class="li" data-go="list"><span class="n">🔎</span><span class="tt"><div>Фразы и вывески</div><div class="muted">Весь разговорник списком, по разделам</div></span></button>
    <button class="li" data-go="my"><span class="n">✍︎</span><span class="tt"><div>Мои фразы</div><div class="muted">Нет нужной фразы — спросите Claude и сохраните ответ офлайн</div></span></button>
    <button class="li" data-go="learn"><span class="n">🃏</span><span class="tt"><div>Карточки</div><div class="muted">Интервальное повторение: фразы, вывески, слова уроков</div></span></button>
    <button class="li" data-go="quiz"><span class="n">✅</span><span class="tt"><div>Тест</div><div class="muted">Выбрать перевод</div></span></button>
    <button class="li" data-go="trips"><span class="n">🧳</span><span class="tt"><div>Поездка</div><div class="muted">Города, отели и вокзалы → карточки для такси</div></span></button>
    <button class="li" data-go="syl"><span class="n">ā</span><span class="tt"><div>Слоги</div><div class="muted">Как читать pinyin, все 406 слогов</div></span></button>
    <button class="li" data-go="set"><span class="n">⚙︎</span><span class="tt"><div>Настройки</div><div class="muted">Тема, резервная копия прогресса, версия</div></span></button>
  </section>
  <section id="v-trips" class="hide"></section>
  <section id="v-my" class="hide"></section>
  <section id="v-set" class="hide"></section>
  <section id="v-syl" class="hide">
    <h2 style="margin-top:4px">Как читать</h2>
    <div class="tips" id="tips"></div>
    <h2>Все слоги</h2>
    <input type="search" id="sq" placeholder="Поиск слога: zh, xi, ань…">
    <div id="syls"></div>
  </section>

Alipay. На границе остаются запасные варианты: QR-код, киоски и бумажная карта.", "На вопросы офицера отвечайте коротко: 旅游 — туризм, срок — в днях (天) или неделях (星期). Держите под рукой адрес отеля."], "phrases": [["入境", "rùjìng", "жу-дзинг", "въезд (паспортный контроль)"], ["外国人", "wàiguórén", "вай-гуо-жэн", "иностранцы (ваша очередь)"], ["入境卡", "rùjìngkǎ", "жу-дзинг-ка", "карта прибытия"], ["旅游", "lǚyóu", "люй-ёу", "туризм"], ["护照", "hùzhào", "ху-джао", "паспорт"]], "sources": [["China Daily: продление безвиза для граждан РФ", "https://regional.chinadaily.com.cn/gansu/2026-05/29/c_1187018.htm", "29.05.2026"], ["ICAO, доклад КНР об онлайн-карте прибытия (DGCA 61)", "https://www.icao.int/sites/default/files/APAC/Meetings/2026/2026%20DGCA61/Agenda%20Item05-Aviation%20Security%20and%20Facilitation/61-IP-05-04-CHN-CHINA-INNOVATIVE-MEASURES-ON-ARRIVAL-CARD-FILING-FOR-FOREIGNERS.pdf", "сентябрь 2026"]]}, {"title": "Перелёты и пауэрбанки", "points": ["Пауэрбанки — только в ручной клади, в сдаваемом багаже запрещены. До 100 Вт·ч — без согласования, 100–160 Вт·ч — с разрешения авиакомпании, больше 160 Вт·ч — нельзя.", "На внутренних рейсах Китая (с 28.06.2025) пауэрбанк без маркировки 3C на корпусе изымают на досмотре. На международных рейсах официально не требуется, но в аэропортах Китая могут проверять на любом досмотре — лучше иметь пауэрбанк с 3C или не брать.", "Лимит количества разные авиакомпании задают по-разному, а правила по 100–160 Вт·ч меняются — уточняйте у перевозчика перед рейсом.", "Из Daxing в город: аэроэкспресс 大兴机场线 — 35 юаней, такси и DiDi — из отдельных зон (出租车 / 网约车).", "Карту прибытия можно заполнить заранее онлайн — см. «Въезд и прилёт»."], "phrases": [["充电宝", "chōngdiànbǎo", "чонг-дьен-бао", "пауэрбанк"], ["充电宝拿出来", "chōngdiànbǎo ná chūlai", "чонг-дьен-бао на чу-лай", "достаньте пауэрбанк"], ["托运", "tuōyùn", "туо-юн", "сдача багажа"], ["登机口", "dēngjīkǒu", "дэнг-дзи-коу", "выход на посадку"], ["大兴机场线", "Dàxīng jīchǎng xiàn", "да-синг дзи-чанг сьен", "аэроэкспресс Daxing"]], "sources": [["Flight-delayed.com: правила CCC для пауэрбанков", "https://www.flight-delayed.com/en-gb/blog/2026/06/03/ccc-power-bank-certification-on-china-flights-everything-you-need-to-know", "03.06.2026"], ["Trip.com: лимиты пауэрбанков в Китае", "https://au.trip.com/guide/info/china-power-bank-limit.html", "дата не указана"], ["Wander in China: метро Пекина (тариф аэроэкспресса)", "https://www.wanderinchina.com/destinations/beijing/transport/metro/", "23.06.2026"]]}, {"title": "Alipay: как платить", "points": ["Два способа. «Я сканирую вас» (我扫你): кнопка «Сканировать», QR продавца, вводите сумму и 6-значный пароль — так в маленьких лавках и у уличной еды. «Вы сканируете меня» (你扫我): показываете свой код оплаты — в сетевых магазинах и кафе.", "Иностранная карта, привязанная напрямую: до 200 юаней за операцию — без комиссии, свыше — 3% от всей суммы. Порог считается на каждую покупку, не за день.", "Нужна проверка личности (паспорт + лицо), она может занять до 24 часов. Переводы людям и «красные конверты» с иностранной картой недоступны — только оплата зарегистрированным продавцам.", "Новому аккаунту при крупной покупке может прийти «System Busy» — начните с мелких оплат."], "phrases": [["我扫你", "wǒ sǎo nǐ", "во сао ни", "я сканирую ваш QR"], ["你扫我", "nǐ sǎo wǒ", "ни сао во", "сканируйте мой код"], ["付款码", "fùkuǎnmǎ", "фу-куан-ма", "код оплаты"], ["扫码", "sǎo mǎ", "сао ма", "сканировать QR"], ["可以用支付宝吗？", "kěyǐ yòng Zhīfùbǎo ma?", "кэ-и ёнг джы-фу-бао ма?", "можно Alipay?"]], "sources": [["Wander in China: Alipay для иностранцев", "https://www.wanderinchina.com/survival-guide/payment/alipay/", "06.02.2026"]]}, {"title": "Такси и DiDi", "points": ["Удобнее всего — DiDi внутри Alipay (раздел «Транспорт» или иконка DiDi): оплата спишется с привязанной карты, наличные не принимают.", "Точку посадки (зелёная точка) ставьте у входа в отель или на углу и идите туда — водитель едет к точке, а не к вам. В аэропортах и на вокзалах подача — в отдельной зоне, указатели 网约车, часто в паркинге.", "Не отвечайте на звонки водителя, если не говорите по-китайски: в чате есть готовое сообщение «я иностранец, следуйте навигации». Сообщения водителя переводятся кнопкой «Translate».", "Обычное такси в Пекине: посадка 13 юаней за первые 3 км, далее 2,3 юаня/км, плюс 1 юань топливный сбор; бывают надбавки за ожидание в пробке и ночью.", "Водитель DiDi может спросить последние цифры вашего телефона (尾号) — называйте по одной цифре [из памяти]."], "phrases": [["网约车", "wǎngyuēchē", "ванг-юэ-чэ", "такси по приложению"], ["上车点", "shàngchēdiǎn", "шанг-чэ-дьен", "точка посадки"], ["我到了", "wǒ dào le", "во дао лэ", "я на месте (пишет водитель)"], ["有点堵", "yǒudiǎn dǔ", "ёу-дьен ду", "небольшая пробка"], ["尾号", "wěihào", "вэй-хао", "последние цифры номера"], ["请打表", "qǐng dǎbiǎo", "чинг да-бяо", "включите счётчик, пожалуйста [из памяти]"]], "sources": [["Wander in China: DiDi для иностранцев", "https://wanderinchina.com/survival-guide/useful-mobile-apps/didi-chuxing/", "05.02.2026"], ["China Daily (chinaservicesinfo): тарифы транспорта Пекина", "https://www.chinaservicesinfo.com/s/202608/04/WS6a718936498e23165e0719ae/im-planning-to-visit-beijing-in-september-and-want-to-know-how-public-transportation-fares-work-i-want-to-make-sure-i-budget-everything-properly.html", "04.08.2026"]]}, {"title": "Метро (Пекин)", "points": ["На входе в каждую станцию — досмотр: сумку на ленту, рамка, иногда ручной металлоискатель. Вода, кофе и еда разрешены; аэрозоли, горючее и большие ножи отберут.", "Оплата: бесконтактная Visa/Mastercard/AmEx/JCB или Apple Pay — к жёлтому считывателю турникета на входе и на выходе. Или Alipay → «Транспорт» → выбрать город → включить QR метро. В каждом городе своя карта: при переезде переключите город.", "Тариф по расстоянию: до 6 км — 3 юаня, 6–12 — 4, 12–22 — 5, 22–32 — 6, далее +1 юань за каждые 20 км. Аэроэкспресс до Daxing — 35 юаней.", "Поезда ходят примерно с 5:00 до 23:30; первый и последний поезд зависят от линии.", "Выходы со станции обозначены буквами и цифрами: A口, B口, C1口 — заранее посмотрите на карте, какой выход ближе к цели."], "phrases": [["安检", "ānjiǎn", "ан-дзьен", "досмотр"], ["进站 / 出站", "jìnzhàn / chūzhàn", "дзин-джан / чу-джан", "вход / выход"], ["换乘", "huànchéng", "хуан-чэнг", "пересадка"], ["号线", "hàoxiàn", "хао-сьен", "линия (7号线 — линия 7)"], ["口", "kǒu", "коу", "выход (A口 — выход A)"]], "sources": [["Wander in China: метро Пекина", "https://www.wanderinchina.com/destinations/beijing/transport/metro/", "23.06.2026"], ["China Daily (chinaservicesinfo): тарифы метро Пекина", "https://www.chinaservicesinfo.com/s/202608/04/WS6a718936498e23165e0719ae/im-planning-to-visit-beijing-in-september-and-want-to-know-how-public-transportation-fares-work-i-want-to-make-sure-i-budget-everything-properly.html", "04.08.2026"]]}, {"title": "Поезда", "points": ["Билет — это паспорт. Имя в брони должно точно совпадать с паспортом (латиница как в машиночитаемой строке).", "Приезжайте минимум за 30 минут, на первый поезд — за час. Посадка через 检票口 обычно открывается за 15–20 минут и закрывается примерно за 5 минут до отправления.", "Автоматы на входе читают иностранный паспорт не везде. Если не прошло — идите в 人工通道 (проход с сотрудником): паспорт сканируют вручную. Держите под рукой подтверждение брони.", "Пауэрбанки больше 100 Вт·ч (≈27 000 мА·ч) на досмотре изымают.", "На вокзалах и в поездах есть краны с кипятком 开水 — можно заварить чай или лапшу [из памяти]."], "phrases": [["检票口", "jiǎnpiàokǒu", "дзьен-пяо-коу", "выход на посадку"], ["人工通道", "réngōng tōngdào", "жэн-гонг тонг-дао", "проход с сотрудником"], ["停止检票", "tíngzhǐ jiǎnpiào", "тинг-джы дзьен-пяо", "посадка окончена"], ["候车室", "hòuchēshì", "хоу-чэ-шы", "зал ожидания"], ["车厢", "chēxiāng", "чэ-сянг", "вагон"], ["开水", "kāishuǐ", "кай-шуэй", "кипяток"]], "sources": [["Hidden China Travel: поезда для иностранцев", "https://hiddenchinatravel.com/book-china-high-speed-rail-foreigners", "01.08.2026"]]}, {"title": "Отель", "points": ["Регистрацию иностранца в полиции делает сам отель — по паспорту при заселении. Если ночуете у знакомых, зарегистрироваться нужно в течение 24 часов в местном отделении полиции.", "Обычно берут депозит (押金) и возвращают при выезде [из памяти].", "Обычно в номере дают две бутылки воды в день бесплатно."], "phrases": [["入住", "rùzhù", "жу-джу", "заселение"], ["退房", "tuìfáng", "туэй-фанг", "выселение"], ["押金", "yājīn", "я-дзин", "депозит"], ["前台", "qiántái", "чьен-тай", "ресепшн"], ["寄存行李", "jìcún xíngli", "дзи-цун синг-ли", "оставить багаж"]], "sources": [["NIA: регистрация проживания иностранцев", "https://en.nia.gov.cn/n167/n247/n10178/c68246/content.html", "дата не указана"], ["The Helpful Panda: 40 China travel tips", "https://thehelpfulpanda.com/china-travel-tips/", "обновлено 16.02.2026"]]}, {"title": "Вода, еда, туалеты", "points": ["Воду из-под крана не пьют. Пейте бутилированную или кипячёную; в общественных местах есть раздатчики горячей воды — холодное питьё в Китае не принято.", "В общественных туалетах часто нет бумаги, а иногда и мыла: носите салфетки и антисептик.", "Чаевые не приняты.", "В ресторанах обычно только палочки — вилку можно попросить, но она есть не везде.", "На рынках торг ожидается; в магазинах и кафе цены фиксированные."], "phrases": [["矿泉水", "kuàngquánshuǐ", "куанг-чюэн-шуэй", "бутилированная вода"], ["纸巾", "zhǐjīn", "джы-дзин", "салфетки"], ["卫生间在哪儿？", "wèishēngjiān zài nǎr?", "вэй-шэнг-дзьен дзай нар?", "где туалет?"], ["筷子", "kuàizi", "куай-дзы", "палочки"], ["有叉子吗？", "yǒu chāzi ma?", "ёу ча-дзы ма?", "есть вилка?"]], "sources": [["The Helpful Panda: 40 China travel tips", "https://thehelpfulpanda.com/china-travel-tips/", "обновлено 16.02.2026"]]}, {"title": "Связь и интернет", "points": ["Мобильный интернет по роумингу или туристической eSIM обычно идёт через шлюз за пределами Китая — Google и WhatsApp работают без VPN.", "Но только по мобильным данным: Wi-Fi отеля, аэропорта, кафе — это китайская сеть, там нужен VPN. С местной китайской SIM-картой VPN нужен всегда.", "Пауэрбанк можно взять в аренду почти везде (充电宝) — через QR в Alipay [из памяти]."], "phrases": [["WiFi密码是多少？", "WiFi mìmǎ shì duōshao?", "WiFi ми-ма шы дуо-шао?", "какой пароль Wi-Fi?"], ["充电宝", "chōngdiànbǎo", "чонг-дьен-бао", "пауэрбанк"], ["手机没电了", "shǒujī méi diàn le", "шоу-дзи мэй дьен лэ", "телефон разрядился"], ["没有信号", "méiyǒu xìnhào", "мэй-ёу син-хао", "нет сигнала"]], "sources": [["Jetpac: eSIM в Китае", "https://www.jetpacglobal.com/blog/best-esim-for-china/", "16.06.2026, изм. 24.08.2026"]]}, {"title": "Розетки", "points": ["220 В, 50 Гц. Встречаются вилки трёх типов: A (две плоские), C (две круглые, европейская), I (три плоские треугольником — основной китайский стандарт).", "Часто розетка сдвоенная: сверху отверстия под A и C, снизу — под I. Зарядке iPhone (100–240 В) трансформатор не нужен; переходник — только если вилка не подходит."], "phrases": [["插座", "chāzuò", "ча-дзуо", "розетка [из памяти]"], ["充电器", "chōngdiànqì", "чонг-дьен-чи", "зарядное устройство [из памяти]"], ["转换插头", "zhuǎnhuàn chātóu", "джуан-хуан ча-тоу", "переходник [из памяти]"]], "sources": [["Trip.com: розетки в Китае", "https://www.trip.com/guide/info/China-plug.html", "29.06.2026"]]}, {"title": "Экстренные номера", "points": ["110 — полиция. 120 — скорая. 119 — пожарные. 122 — ДТП. 12110 — SMS в полицию, если звонить нельзя.", "По-английски на экстренных линиях говорят не везде — проще попросить сотрудника отеля или прохожего позвонить за вас (карточка «Нужна помощь»).", "12345 — городская справочная линия; на сайте Пекина заявлена поддержка 10 языков, включая русский (часы работы не указаны).", "Заранее сохраните в телефоне контакты посольства и консульств России в Китае."], "phrases": [["请帮帮我！", "qǐng bāngbang wǒ!", "чинг банг-банг во!", "помогите!"], ["请打120", "qǐng dǎ yāo èr líng", "чинг да яо эр линг", "позвоните 120"], ["我需要医生", "wǒ xūyào yīshēng", "во сюй-яо и-шэнг", "мне нужен врач"], ["报警", "bàojǐng", "бао-дзинг", "вызвать полицию"]], "sources": [["China Xian Tour: полезные номера", "https://www.chinaxiantour.com/travel-guide/china-useful-phone-numbers", "17.01.2026"], ["Пекин, линия 12345", "https://english.beijing.gov.cn/12345hotline/", "дата не указана"]]}, {"title": "Этикет и мелочи", "points": ["Очередей в привычном смысле может не быть, личное пространство меньше — не принимайте на свой счёт.", "На политические темы лучше не высказываться. В храмах — тихо, монахов не фотографировать.", "Палочки не втыкают вертикально в рис — так делают на поминках [из памяти].", "4 (四 sì) звучит похоже на «смерть» и считается несчастливым, 8 (八 bā) — счастливым: поэтому нет 4-го этажа, а цены с восьмёрками [из памяти].", "Числа 6–10 часто показывают жестами одной руки — см. урок 4."], "phrases": [["没关系", "méi guānxi", "мэй гуан-си", "ничего страшного"], ["不好意思", "bù hǎo yìsi", "бу хао и-сы", "извините"], ["可以拍照吗？", "kěyǐ pāizhào ma?", "кэ-и пай-джао ма?", "можно сфотографировать?"]], "sources": [["The Helpful Panda: 40 China travel tips", "https://thehelpfulpanda.com/china-travel-tips/", "обновлено 16.02.2026"]]}], "checked": "17.10.2026", "hotel": {"name_zh": "示例酒店", "name_en": "Example Hotel", "addr_zh": "示例路1号", "addr_py": "Shìlì lù yī hào", "phone": "+86 10 0000 0000", "metro_zh": "示例地铁站（步行约200米）"}, "trip": {"taxi": ["师傅，请带我们去这个酒店：", "Shīfu, qǐng dài wǒmen qù zhège jiǔdiàn", "шы-фу, чинг дай во-мэн чюй джэ-гэ дзёу-дьен"], "station": ["师傅，请带我们去这个火车站：", "Shīfu, qǐng dài wǒmen qù zhège huǒchēzhàn", "шы-фу, чинг дай во-мэн чюй джэ-гэ хуо-чэ-джан"], "phone": "酒店电话："}, "ver": "ee86531e", "built": "2026-10-17"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("cn:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cn:" + k, JSON.stringify(v)); } catch {} }
};

const ALL = [];
for (const [sect, items] of Object.entries(DATA.phrases)) for (const [zh, py, cy, ru] of items) ALL.push({zh, py, cy, ru, deck: "Фразы: " + sect});
for (const [zh, py, cy, ru, g] of DATA.signs) ALL.push({zh, py, cy, ru, deck: "Вывески: " + g});
for (const [zh, py, cy, ru] of DATA.numbers) ALL.push({zh, py, cy, ru, deck: "Цифры"});
for (const [zh, py, cy, ru] of DATA.stations) ALL.push({zh, py, cy, ru, deck: "Вокзалы"});
for (const l of DATA.lessons) for (const b of l.theory) if (b.k === "e") ALL.push({zh: b.zh, py: b.py, cy: b.cy, ru: b.ru, deck: `Урок ${l.n}: ${l.title}`});
ALL.forEach((c, i) => c.id = c.deck + "|" + c.zh);

// ---- pinyin → кириллица: те же правила, что translit.py (таблица слогов приходит из сборки)
const SYL = new Map(); for (const [, list] of DATA.syllables) for (const [p, c] of list) SYL.set(p, c);
const stripTones = t => t.normalize("NFD").replace(/[\u0300-\u0307\u0309-\u036f]/g, "").normalize("NFC");  // тоны долой, ü (U+0308) оставляем
function segment(w) {
  const best = [[]];
  for (let i = 0; i < w.length; i++) {
    if (!best[i]) continue;
    for (let L = 1; L <= Math.min(6, w.length - i); L++) {
      const p = w.slice(i, i + L);
      if (SYL.has(p) && (!best[i + L] || best[i].length + 1 < best[i + L].length)) best[i + L] = best[i].concat(p);
    }
  }
  return best[w.length] || null;
}
function wordCyr(w) {
  const parts = [];
  for (const chunk of stripTones(w).toLowerCase().split("'")) {
    let seg = segment(chunk), er = "";
    if (!seg && chunk.endsWith("r")) { seg = segment(chunk.slice(0, -1)); er = "р"; }
    if (!seg) return null;
    const cy = seg.map(x => SYL.get(x)); cy[cy.length - 1] += er; parts.push(...cy);
  }
  return parts.join("-");
}
const toCyr = t => String(t).replace(/[A-Za-z\u00C0-\u024F']+/g, w => wordCyr(w) ?? w);

// ---- мои фразы (добавлены пользователем, например из ответа Claude)
const MY = "Мои фразы";
let myList = store.get("my", []);
function syncMy() {
  for (let i = ALL.length - 1; i >= 0; i--) if (ALL[i].deck === MY) ALL.splice(i, 1);
  for (const m of myList) ALL.push({zh: m.zh, py: m.py, cy: toCyr(m.py), ru: m.ru, deck: MY, id: MY + "|" + m.zh});
}
syncMy();

const DAY = 864e5;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isoDay = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const parseDay = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]).getTime() : null; };

// ---- интервальное повторение (упрощённый Лейтнер): ящик 0 — новая, 1..5 — интервалы ниже
const IVL = [0, 1, 3, 7, 16, 35];
let srs = store.get("srs", null);
if (!srs) {  // перенос старого прогресса «знаю»
  srs = {}; const old = store.get("known", {});
  for (const id in old) srs[id] = {b: 2, due: today() + IVL[2] * DAY};
  store.set("srs", srs);
}
const isDue = c => srs[c.id] && srs[c.id].due <= today() && srs[c.id].b > 0;
const isNew = c => !srs[c.id];
const isLearned = c => srs[c.id] && srs[c.id].b >= 3;

// ---- избранное: снимок фразы, чтобы показывать без поиска по данным
let favs = store.get("favs", {});
const favId = c => c.id || ("x|" + [].concat(c.zh).join(""));
const isFav = c => !!favs[favId(c)];
function toggleFav(c) {
  const id = favId(c);
  if (favs[id]) delete favs[id]; else favs[id] = {id, zh: [].concat(c.zh), py: c.py, cy: c.cy, ru: c.ru, t: Date.now()};
  store.set("favs", favs); return !!favs[id];
}
const favCards = () => Object.values(favs).sort((a, b) => a.t - b.t).map(f => ({...f, zh: f.zh.join(""), lines: f.zh, deck: "★ Избранное"}));

const decks = ["Все", "★ Избранное", MY, "Все фразы", "Все вывески", ...new Set(ALL.map(c => c.deck).filter(d => d !== MY))];
decks.forEach(d => $("deck").add(new Option(d, d)));
$("deck").value = store.get("deck", "Все");
function cards() {
  const d = $("deck").value;
  if (d === "Все") return ALL;
  if (d === "★ Избранное") return favCards();
  if (d === "Все фразы") return ALL.filter(c => c.deck.startsWith("Фразы"));

// свайпы: универсальный обработчик (горизонтальный жест, без конфликта с вертикальной прокруткой)
function onSwipe(el, fn) {
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, {passive: true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return; const t = e.changedTouches[0]; let dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (el === $("full") && fullS && fullS.rot) [dx, dy] = [dy, -dx];

}

let cur = null, flipped = false, again = [];
function nextCard() {
  const cs = cards();
  // порядок: ошибки этой сессии (через 3 карточки) → к повторению → новые → «всё выучено» случайно
  const due = cs.filter(isDue), fresh = cs.filter(isNew);
  let pool = due.length ? due : fresh.length ? fresh : cs;
  if (again.length && (again[0].wait-- <= 0 || (!due.length && !fresh.length))) { const id = again.shift().id; const c = cs.find(x => x.id === id); if (c) { cur = c; flipped = false; return drawCard(); } }
  pool = pool.filter(c => c !== cur || pool.length === 1);
  cur = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null; flipped = false; drawCard();
}

// ---- числа на слух
const DIG = "零一二三四五六七八九";
function num2zh(n) {
  if (n < 10) return DIG[n];
  if (n < 20) return "十" + (n % 10 ? DIG[n % 10] : "");
  if (n < 100) return DIG[Math.floor(n / 10)] + "十" + (n % 10 ? DIG[n % 10] : "");
  const big = (k, name) => { const h = Math.floor(n / k), r = n % k; let s = (h === 2 ? "两" : DIG[h]) + name;
    if (!r) return s; return s + (r < k / 10 ? "零" : "") + (r < 20 && r >= 10 ? "一" : "") + num2zh(r); };
  if (n < 1000) return big(100, "百");
  if (n < 10000) return big(1000, "千");
  return String(n);
}
const NPY = {"零": "líng", "一": "yī", "二": "èr", "两": "liǎng", "三": "sān", "四": "sì", "五": "wǔ", "六": "liù", "七": "qī", "八": "bā", "九": "jiǔ", "十": "shí", "百": "bǎi", "千": "qiān", "块": "kuài"};
const NCY = {"零": "линг", "一": "и", "二": "эр", "两": "лянг", "三": "сан", "四": "сы", "五": "у", "六": "лёу", "七": "чи", "八": "ба", "九": "дзёу", "十": "шы", "百": "бай", "千": "чьен", "块": "куай"};
function zhPy(s) { return [...s].map((c, i) => c === "一" && i < s.length - 1 && "百千".includes(s[i + 1]) ? "yì" : NPY[c]).join(" "); }
function zhCy(s) { return [...s].map(c => NCY[c]).join("-"); }
function numTask() {
  const r = Math.random(); let n, half = false;
  if (r < .25) n = 1 + Math.floor(Math.random() * 20);
  else if (r < .6) n = 20 + Math.floor(Math.random() * 80);
  else if (r < .9) n = 100 + Math.floor(Math.random() * 900);
  else n = 1000 + Math.floor(Math.random() * 9000);
  if (n < 100 && Math.random() < .25) half = true;
  const zh = num2zh(n) + "块" + (half ? "五" : "");
  const fmt = (v, h) => "¥ " + v + (h ? ",5" : "");
  const pool = new Set([fmt(n, half)]);
  const cands = [n + 10, n - 10, n * 10, Math.floor(n / 10) || n + 1, n + 1, Number(String(n).split("").reverse().join("")) || n + 2, n + 100];
  for (const c of shuffle(cands)) { if (pool.size >= 4) break; if (c > 0 && c !== n) pool.add(fmt(c, half)); }
  while (pool.size < 4) pool.add(fmt(n + pool.size * 3, half));
  const opts = shuffle([...pool]);
  return {t: "numq", zh, py: zhPy(zh), cy: zhCy(zh), ru: fmt(n, half), opts, ok: opts.indexOf(fmt(n, half))};
}

}
function parseMy(text) {
  const out = [];

    const parts = line.split(/\s*[|｜]\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 3 || !/[㐀-鿿]/.test(parts[0])) continue;
    const [zh, py, ...ru] = parts;
    const bad = (py.match(/[A-Za-zÀ-ɏ']+/g) || []).filter(w => wordCyr(w) === null && !/^[A-Z]+$|^WiFi$/.test(w));
    out.push({zh, py, ru: ru.join(" | "), cy: toCyr(py), bad});
  }
  return out;
}

  let h = `<p class="muted">Нет нужной фразы в разговорнике? Спросите Claude в приложении (по вашей подписке) и вставьте ответ: фраза сохранится на iPhone и будет доступна офлайн — в поиске, карточках и показе крупно. Кириллицу тренажёр посчитает сам.</p>
  <div class="form"><label>1. Что нужно сказать (по-русски)</label><textarea id="my-ask" rows="2" placeholder="у меня аллергия на арахис">${esc(myAsk)}</textarea></div>
  <div class="row"><button class="btn yes" data-m="ask">Спросить Claude</button></div>
  <p class="muted">${on ? "Запрос скопируется в буфер и откроется Claude. Если поле ввода там пустое — вставьте запрос." : "Нужен интернет (из Китая — через VPN)."}</p>
  <div class="form"><label>2. Ответ Claude — строки «汉字 | pinyin | русский»</label><textarea id="my-paste" rows="4" lang="zh">${esc(myPaste)}</textarea></div>
  <div class="row"><button class="btn" data-m="paste">Вставить из буфера</button><button class="btn" data-m="parse">Разобрать</button></div>`;
  if (myParsed) {
    h += myParsed.length ? `<h2>Будет добавлено: ${myParsed.length}</h2>` + myParsed.map(c => `<div class="item${c.zh.length > 5 ? " long" : ""}"><div class="zh">${esc(c.zh)}</div><div class="t"><div class="py">${esc(c.py)}</div><div class="cy">${esc(c.cy)}</div><div>${esc(c.ru)}</div>${c.bad.length ? `<div class="note" style="color:var(--acc)">не разобран pinyin: ${esc(c.bad.join(", "))} — для этих слов кириллицы нет</div>` : ""}</div></div>`).join("") +
      `<div class="row"><button class="btn yes" data-m="save">Сохранить</button><button class="btn" data-m="cancel">Отмена</button></div>`
      : `<div class="why">Не нашёл строк формата «汉字 | pinyin | русский». Попросите Claude ответить в этом формате.</div>`;
  }
  h += `<h2>Сохранено: ${mine.length}</h2>` + (mine.length ? mine.map((c, i) => `<div class="item${c.zh.length > 5 ? " long" : ""}" data-mi="${i}"><div class="zh">${esc(c.zh)}</div><div class="t"><div class="py">${esc(c.py)}</div><div class="cy">${esc(c.cy)}</div><div>${esc(c.ru)}</div></div><button class="say" data-z="${esc(c.zh)}">🔊</button><button class="fav" data-del="${i}" aria-label="Удалить">✕</button></div>`).join("") : `<p class="muted">Пока пусто.</p>`);
  box.innerHTML = h;
  $("my-ask").oninput = e => { myAsk = e.target.value; };
  $("my-paste").oninput = e => { myPaste = e.target.value; };
  box.onclick = e => {
    const d = e.target.closest("[data-del]");
    if (d) { const c = mine[+d.dataset.del]; if (confirm("Удалить «" + c.zh + "»?")) { myList = myList.filter(m => m.zh !== c.zh); store.set("my", myList); syncMy(); drawMy(); } return; }
    if (e.target.closest(".say")) return;
    const it = e.target.closest("[data-mi]"); if (it) return openFull(mine[+it.dataset.mi], mine, +it.dataset.mi);
    const b = e.target.closest("[data-m]"); if (!b) return; const k = b.dataset.m;
    if (k === "ask") {
      const q = myAsk.trim(); if (!q) return $("my-ask").focus();
      const pr = claudePrompt(q);
      // оба вызова синхронно, пока жест пользователя «живой» — иначе iOS блокирует
      try { navigator.clipboard.writeText(pr).catch(() => {}); } catch {}
      window.open("https://claude.ai/new?q=" + encodeURIComponent(pr), "_blank", "noopener");
      return;
    }
    if (k === "paste") {
      if (!navigator.clipboard || !navigator.clipboard.readText) return $("my-paste").focus();
      navigator.clipboard.readText().then(t => { myPaste = t; myParsed = parseMy(t); drawMy(); }).catch(() => $("my-paste").focus());
      return;
    }
    if (k === "parse") myParsed = parseMy(myPaste);
    if (k === "cancel") myParsed = null;
    if (k === "save" && myParsed) {
      for (const c of myParsed) { myList = myList.filter(m => m.zh !== c.zh); myList.push({zh: c.zh, py: c.py, ru: c.ru, t: Date.now()}); }
      store.set("my", myList); syncMy(); myParsed = null; myPaste = ""; myAsk = "";
    }
    drawMy();
  };
}

// ---- главная и поиск по всему
let homeQ = "";
function searchAll(raw) {
  const q = raw.trim(), s = norm(q), s0 = s.replace(/[\s'-]/g, "");
  const hit = (...xs) => xs.some(x => x && (String(x).includes(q) || norm(x).includes(s) || norm(x).replace(/[\s'-]/g, "").includes(s0)));
  const seen = new Set(), ph = [];
  const sc = showCards().map(c => ({...c, zh: c.zh.join(""), lines: c.zh, deck: "Показать"}));
  for (const c of [...sc, ...favCards(), ...ALL]) {
    if (seen.has(c.zh + "|" + c.ru)) continue;
    if (hit(c.zh, c.py, c.cy, c.ru)) { seen.add(c.zh + "|" + c.ru); ph.push(c); }
  }
  const starts = c => norm(c.ru).startsWith(s) || norm(c.py).startsWith(s) || c.zh.startsWith(q) ? 0 : 1;
  ph.sort((a, b) => starts(a) - starts(b));
  return {
    ph: ph.slice(0, 60), more: Math.max(0, ph.length - 60),
    gd: DATA.guide.map((g, i) => ({g, i})).filter(x => hit(x.g.title, ...x.g.points)),
    les: DATA.lessons.filter(l => hit(l.title, l.goal)),
    dlg: DATA.dialogs.map((d, i) => ({d, i})).filter(x => hit(x.d.title, x.d.intro)),
  };
}
let homeRes = [];
function drawHomeRes() {
  const r = searchAll(homeQ); homeRes = r.ph;
  let h = "";
  if (r.ph.length) {
    h += `<h2>Фразы и вывески</h2>` + r.ph.map((c, i) => `<div class="ritem" data-ri="${i}"><div class="t"><div class="zh">${esc(c.zh)}</div><div class="m"><span class="py">${esc(c.py || "")}</span> · <span class="cy">${esc(c.cy || "")}</span></div><div class="m">${esc(c.ru)} <span class="muted">· ${esc(c.deck)}</span></div></div><button class="fav${isFav(c) ? " on" : ""}" data-fv="${i}">${isFav(c) ? "★" : "☆"}</button></div>`).join("");
    if (r.more) h += `<p class="muted">…и ещё ${r.more}. Уточните запрос.</p>`;
  }
  if (r.gd.length) h += `<h2>Справка</h2>` + r.gd.map(x => `<button class="rlink" data-go-gd="${x.i}">${esc(x.g.title)}</button>`).join("");
  if (r.les.length) h += `<h2>Уроки</h2>` + r.les.map(l => `<button class="rlink" data-go-les="${l.n}">Урок ${l.n}. ${esc(l.title)}<small>${esc(l.goal)}</small></button>`).join("");
  if (r.dlg.length) h += `<h2>Диалоги</h2>` + r.dlg.map(x => `<button class="rlink" data-go-dlg="${x.i}">${esc(x.d.title)}<small>${esc(x.d.intro)}</small></button>`).join("");
  if (!h) h = `<p class="muted" style="margin-top:14px">Ничего не найдено. Ищите по-русски, pinyin (можно без тонов), кириллицей или иероглифами.</p>`;
  h += `<button class="blk" data-ask="1" style="margin-top:14px"><div class="lbl">Нет нужной фразы?</div><div class="big2">Спросить Claude: «${esc(homeQ.trim())}»</div><div class="muted">Ответ сохраните в «Мои фразы» — будет работать офлайн</div></button>`;
  $("hres").innerHTML = h;
}
function openLesson(n) { lesState = {l: DATA.lessons[n - 1], mode: "theory"}; go("les"); }
function openDialog(i) { dlg = {d: DATA.dialogs[i], idx: i, step: 0, log: [], errors: 0}; advanceDlg(); go("dlg"); }
function dayPhrase() {
  const pool = ALL.filter(c => c.deck.startsWith("Фразы") && !/слышите|спросят/.test(c.ru));
  return pool[Math.floor(today() / DAY) % pool.length];
}
function drawHome() {
  const box = $("v-home");
  if (!$("hq")) {
    box.innerHTML = `<div class="hero"><h1><span>你好</span> · Китайский</h1><span class="net" id="net"><i></i></span></div><div class="sub" id="hsub"></div>
      <input type="search" id="hq" placeholder="Найти: «вода», «shui», «туалет», 水…" autocomplete="off" enterkeyhint="search">
      <div id="hres" class="res"></div><div id="hbody"></div>`;
    $("hq").oninput = () => { homeQ = $("hq").value; drawHome(); };
    box.onclick = e => {
      const f = e.target.closest("[data-fv]"); if (f) { const on = toggleFav(homeRes[+f.dataset.fv]); f.classList.toggle("on", on); f.textContent = on ? "★" : "☆"; return; }
      const ri = e.target.closest("[data-ri]"); if (ri) return openFull(homeRes[+ri.dataset.ri], homeRes, +ri.dataset.ri);
      const g = e.target.closest("[data-go-gd]"); if (g) { gdOpen = +g.dataset.goGd; return go("gd"); }
      const l = e.target.closest("[data-go-les]"); if (l) return openLesson(+l.dataset.goLes);
      const d = e.target.closest("[data-go-dlg]"); if (d) return openDialog(+d.dataset.goDlg);
      const sh = e.target.closest("[data-sh]"); if (sh) { const list = showCards(); const i = list.findIndex(c => c.id.endsWith(sh.dataset.sh) || c.id.startsWith("trip:" + sh.dataset.sh)); return openFull(list[Math.max(0, i)], list, Math.max(0, i)); }
      if (e.target.closest("[data-ask]")) { myAsk = homeQ.trim(); myParsed = null; return go("my"); }
      const a = e.target.closest("[data-h]"); if (!a) return; const k = a.dataset.h;
      if (k === "srs") { $("deck").value = "Все"; store.set("deck", "Все"); cur = null; go("learn"); }
      if (k === "fav") { $("deck").value = "★ Избранное"; store.set("deck", "★ Избранное"); go("list"); }
      if (k === "trip") go("trips");
      if (k === "show") go("show");
      if (k === "pday") { const c = dayPhrase(); openFull(c, [c], 0); }
      if (k === "say") say(dayPhrase().zh);
      if (k.startsWith("les")) openLesson(+k.slice(3));
    };
  }
  if ($("hq").value !== homeQ) $("hq").value = homeQ;
  const on = navigator.onLine; $("net").className = "net" + (on ? " on" : ""); $("net").innerHTML = `<i></i>${on ? "онлайн" : "офлайн"}`;
  $("hsub").textContent = tripLine();
  const searching = homeQ.trim().length > 0;
  $("hres").classList.toggle("hide", !searching); $("hbody").classList.toggle("hide", searching);
  if (searching) return drawHomeRes();
  const pool = [...ALL, ...favCards().filter(f => !ALL.some(c => c.id === f.id))];
  const due = pool.filter(isDue).length, fresh = pool.filter(isNew).length;
  const best = lesBest(), next = DATA.lessons.find(l => best[l.n] == null);
  const p = dayPhrase(), fv = favCards(), s = curStop();
  let h = `<div class="quick"><button class="qk main" data-sh="taxi"><b>🚕</b>Такси${s && s.hotel ? " в отель" : ""}</button><button class="qk" data-sh="nochinese"><b>🗣</b>Не говорю</button><button class="qk" data-sh="help"><b>🆘</b>Помощь</button></div>`;
  h += `<button class="blk" data-h="srs"><div class="lbl">Карточки</div><div class="big2">${due ? `Повторить ${due}` : fresh ? "Учить новые" : "Всё повторено"}</div><div class="muted">${due ? "карточек ждут повторения сегодня · " : ""}новых ${fresh} из ${pool.length}</div></button>`;
  h += next ? `<button class="blk" data-h="les${next.n}"><div class="lbl">Урок ${next.n} из ${DATA.lessons.length}</div><div class="big2">${esc(next.title)}</div><div class="muted">~${next.min} мин · ${next.ex.length} упражнений</div></button>`
            : `<button class="blk" data-h="les1"><div class="lbl">Уроки</div><div class="big2">Все 8 уроков пройдены</div><div class="muted">Повторите любой — ошибки можно прорешать отдельно</div></button>`;
  h += `<div class="blk" data-h="pday"><div class="lbl">Фраза дня</div><div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><div class="zh">${esc(p.zh)}</div><div><span class="py">${esc(p.py)}</span> · <span class="cy">${esc(p.cy)}</span></div><div>${esc(p.ru)}</div></div><button class="say" data-h="say">🔊</button></div></div>`;
  if (fv.length) h += `<button class="blk" data-h="fav"><div class="lbl">Избранное · ${fv.length}</div><div class="zh" style="font-size:20px">${fv.slice(0, 6).map(f => esc(f.zh)).join(" · ")}</div></button>`;
  h += `<button class="blk" data-h="trip"><div class="lbl">Поездка</div><div class="big2">${esc(s ? (s.city || "Город") : "Добавить город")}</div><div class="muted" lang="zh">${esc(s && s.hotel ? s.hotel : "Отель и вокзал → карточки для такси")}</div></button>`;
  h += `<p class="muted" style="text-align:center;font-size:12px">Работает без интернета · версия ${esc(DATA.built)}</p>`;
  $("hbody").innerHTML = h;
}
window.addEventListener("online", () => view === "home" && drawHome());
window.addEventListener("offline", () => view === "home" && drawHome());

// ---- настройки: тема, резервная копия, версия
function setTheme(t) { store.set("theme", t); if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; }
async function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("cn:")) data[k] = localStorage.getItem(k); }
  const text = JSON.stringify({app: "cn-trainer", ver: DATA.built, saved: new Date().toISOString(), data}, null, 1);
  const name = "cn-trainer-" + isoDay(Date.now()) + ".json";
  try {
    const file = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.app !== "cn-trainer" || !j.data) throw new Error("не похоже на копию тренажёра");
      if (!confirm(`Восстановить копию от ${String(j.saved).slice(0, 10)}? Текущий прогресс будет заменён.`)) return;
      for (const k of Object.keys(localStorage)) if (k.startsWith("cn:")) localStorage.removeItem(k);
      for (const [k, v] of Object.entries(j.data)) if (k.startsWith("cn:")) localStorage.setItem(k, v);
      location.reload();
    } catch (e) { alert("Не удалось восстановить: " + e.message); }
  };
  r.readAsText(file);
}
function drawSettings() {
  const t = store.get("theme", "auto"), seg = (v, l) => `<button data-th="${v}" class="${t === v ? "on" : ""}">${l}</button>`;
  const used = Object.keys(localStorage).filter(k => k.startsWith("cn:")).reduce((n, k) => n + localStorage.getItem(k).length, 0);
  $("v-set").innerHTML = `<h2 style="margin-top:4px">Тема</h2><div class="seg">${seg("auto", "Как в системе")}${seg("light", "Светлая")}${seg("dark", "Тёмная")}</div>
    <h2>Резервная копия</h2><p class="muted">Прогресс, избранное и поездка хранятся только на этом iPhone (${Math.ceil(used / 1024)} КБ). Сохраните копию в «Файлы» перед переустановкой или сменой телефона.</p>
    <div class="row"><button class="btn" data-s="exp">Сохранить копию</button><button class="btn" data-s="imp">Восстановить</button></div><input type="file" id="impf" accept="application/json,.json" class="hide">
    <h2>Обновление</h2><p class="muted">Версия ${esc(DATA.built)} (${esc(DATA.ver)}). При интернете новая версия скачивается сама — появится кнопка «Обновить».</p>
    <div class="row"><button class="btn" data-s="upd">Проверить сейчас</button></div><div class="muted" id="updst"></div>
    <h2>О приложении</h2><p class="muted">Открытый проект: <a href="https://github.com/aleksandrkaiser/cn-trainer" target="_blank" rel="noopener" style="color:var(--cy)">github.com/aleksandrkaiser/cn-trainer</a> · <a href="China_razgovornik.pdf" target="_blank" style="color:var(--cy)">PDF-версия</a> · лицензия MIT.</p>
    <div class="row"><button class="btn" data-s="reset" style="font-size:14px">Сбросить весь прогресс</button></div>`;
  $("v-set").onclick = e => {
    const th = e.target.closest("[data-th]"); if (th) { setTheme(th.dataset.th); return drawSettings(); }
    const b = e.target.closest("[data-s]"); if (!b) return; const k = b.dataset.s;
    if (k === "exp") exportData();
    if (k === "imp") $("impf").click();
    if (k === "upd") { $("updst").textContent = navigator.onLine ? "Проверяю…" : "Нет интернета."; if (swReg && navigator.onLine) swReg.update().then(() => { setTimeout(() => { if ($("updst")) $("updst").textContent = $("upd").classList.contains("hide") ? "Установлена последняя версия." : "Есть новая версия — нажмите «Обновить» внизу."; }, 2500); }).catch(() => { $("updst").textContent = "Не удалось проверить."; }); }
    if (k === "reset" && confirm("Сбросить прогресс уроков, диалогов, карточек и избранное? Поездка сохранится.")) {
      for (const key of ["srs", "known", "les", "dlg", "favs"]) localStorage.removeItem("cn:" + key);
      location.reload();
    }
  };
  $("impf").onchange = e => e.target.files[0] && importData(e.target.files[0]);
}

$("deck").onchange = () => { store.set("deck", $("deck").value); cur = null; again = []; render(); };
function render() {
  if (view === "home") drawHome();
  if (view === "trips") drawTrips();
  if (view === "my") drawMy();
  if (view === "set") drawSettings();
  if (view === "show") drawShows();
  if (view === "les") drawLessons();
  if (view === "dlg") drawDialogs();
  if (view === "gd") drawGuide();
  if (view === "learn") { if (!cur || !cards().includes(cur)) nextCard(); else drawCard(); }
  if (view === "quiz") newQ();
  if (view === "list") drawList();
  if (view === "syl") drawSyl();
}
$("deck").parentElement.classList.add("hide");
render();

// ---- офлайн-кэш и обновления: новая версия ставится в фоне, страница предлагает перезапуск
let swReg = null;
if ("serviceWorker" in navigator) {
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl) $("upd").classList.remove("hide"); });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; if (navigator.onLine) r.update().catch(() => {}); }).catch(() => {}));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && swReg && navigator.onLine) swReg.update().catch(() => {}); });
}
$("updgo").onclick = () => location.reload();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
</script>
