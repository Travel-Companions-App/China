name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Сборка и проверки данных
        run: sh src/build.sh

      - name: Собранное приложение совпадает с исходниками
        run: |
          git diff --exit-code -- index.html sw.js manifest.webmanifest sitemap.xml \
            || (echo "::error::index.html/sw.js устарели — запустите sh src/build.sh и закоммитьте результат"; exit 1)

      - name: Сквозной тест (главная, места, уроки, офлайн, обновление)
        run: python src/e2e.py
